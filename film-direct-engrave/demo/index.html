const BG='#130f10',INK='#f5efe2',CYAN='#3be6d6',BLUE='#3585e2',RED='#df3e30',GOLD='#e7bc27';
const EASE=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, EO=x=>1-Math.pow(1-cl(x),3), EI=x=>cl(x)**3;

let HOLD=0,T=0,TR;
// grain tiles
const tiles=[];{const R=rng(7);for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');const im=x.createImageData(480,270);for(let i=0;i<im.data.length;i+=4){const v=R()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=22}x.putImageData(im,0,0);tiles.push(c)}}
// densify + jitter (re-sampled every hold)
function dens(p,step=9){const o=[];for(let i=0;i<p.length;i++){if(i){const[a,b]=p[i-1],[c,d]=p[i];const n=Math.max(1,Math.floor(Math.hypot(c-a,d-b)/step));for(let k=1;k<n;k++)o.push([lerp(a,c,k/n),lerp(b,d,k/n)])}o.push(p[i])}return o}
function jit(p,seed,amp){return p.map((q,i)=>[q[0]+(h2(seed*31+i*7,HOLD)-.5)*2*amp,q[1]+(h2(seed*31+i*7+3,HOLD)-.5)*2*amp])}
// scratched line: variable width, broken by dark seams, overshooting ends, partial growth p
function scr(pts0,seed,o={}){const p=o.p??1;if(p<=0)return;let pts=dens(pts0);
 // overshoot
 const ext=(a,b,k)=>{const dx=a[0]-b[0],dy=a[1]-b[1],l=Math.hypot(dx,dy)||1;return[a[0]+dx/l*k,a[1]+dy/l*k]};
 if(pts.length>1&&!o.closed){pts.unshift(ext(pts[0],pts[1],3+h2(seed,HOLD)*5));pts.push(ext(pts[pts.length-1],pts[pts.length-2],3+h2(seed+1,HOLD)*5))}
 pts=jit(pts,seed,o.amp??1.3);const w=o.w??1.1,col=o.col||INK;
 let Ls=[0];for(let i=1;i<pts.length;i++)Ls.push(Ls[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const end=Ls[Ls.length-1]*p;
 g.strokeStyle=col;g.lineCap='round';g.globalAlpha=o.a??1;
 for(let i=1;i<pts.length&&Ls[i-1]<end;i++){const r=h2(seed*5+i,HOLD);if(r<.05)continue; // seam gap
  let[x,y]=pts[i];if(Ls[i]>end){const f=(end-Ls[i-1])/(Ls[i]-Ls[i-1]);x=lerp(pts[i-1][0],x,f);y=lerp(pts[i-1][1],y,f)}
  g.lineWidth=w*(.55+h2(seed*9+i,HOLD)*.9);g.beginPath();g.moveTo(pts[i-1][0],pts[i-1][1]);g.lineTo(x,y);g.stroke()}
 // second thin scratch pass slightly offset
 g.globalAlpha=(o.a??1)*.5;g.lineWidth=w*.4;g.beginPath();for(let i=0;i<pts.length&&Ls[i]<=end;i++){const x=pts[i][0]+1.4,y=pts[i][1]-1;i?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();g.globalAlpha=1}
function ell(cx,cy,rx,ry,a0=0,a1=Math.PI*2,rot=0,n=40){const p=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n),x=Math.cos(a)*rx,y=Math.sin(a)*ry;p.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}return p}
function pathOf(p,seed,amp){const q=jit(dens(p,12),seed+500,amp);g.beginPath();q.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.closePath()}

 const sweep=lerp(x0,x1,EO(rev));g.beginPath();g.rect(x0,y0,sweep-x0+30,y1-y0);g.clip();
 g.globalCompositeOperation='lighter';g.fillStyle=col;g.globalAlpha=.2*a;g.fillRect(x0,y0,x1-x0,y1-y0);

 let off=-diag;while(off<diag){off+=2.2+R()*2.6;const cx=(x0+x1)/2+nx*off,cy=(y0+y1)/2+ny*off;let s=-diag;
  while(s<diag){const len=20+R()*90;g.globalAlpha=(.3+R()*.55)*a;g.lineWidth=.5+R()*1.6;g.beginPath();g.moveTo(cx+dx*s,cy+dy*s);g.lineTo(cx+dx*(s+len),cy+dy*(s+len));g.stroke();s+=len+R()*7}}

 const face=[];for(let i=0;i<=36;i++){const a=-1.3+i/36*6.0;const r=1+.06*Math.sin(a*3+seed);face.push([Math.cos(a)*54*r,Math.sin(a)*62*r+ (Math.sin(a)>0?Math.sin(a)*6:0)])}

 for(const sx of[-1,1]){const ex=sx*20,ey=-2;
  if(e<.5){scr(P(ell(ex,ey-4,11,7,.25,Math.PI-.25)),seed+5+sx,{w:2,p});for(let k=0;k<3;k++)scr(P([[ex-6+k*6,ey+3],[ex-8+k*7,ey+9]]),seed+8+k+sx*3,{w:1,p,amp:.6})}

}
