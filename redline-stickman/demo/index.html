<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
html,body{margin:0;background:#e9e5df;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="timing.js"></script><script>
// 红线火柴人 Redline Stickman v2 — every frame = pure fn of t; seeded; brush lines boil 12x/s. Keyword triggers come from VO timing (timing.js).
const W=1080,H=1920,FPS=30,{K,CAP,ENV,DUR}=window.TIMING;window.DUR=DUR;
const cv=document.getElementById('c');cv.width=W;cv.height=H;const X=cv.getContext('2d');
const PAPER='#e9e5df',INK='#241e1d',RED='#c9262f',GREY='#8a8580',SUB='#9a948d',SKIN='#f6f1e7';
const SANS='"PingFang SC","Noto Sans CJK SC",sans-serif',SERIF='"Songti SC","Noto Serif CJK SC",serif',HEAD='Anton,"PingFang SC","Noto Sans CJK SC",sans-serif';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),EO=x=>1-Math.pow(1-cl(x),3),EB=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},lerp=(a,b,t)=>a+(b-a)*t;
// trigger: element starts on the first frame at/after spoken onset
const ON=k=>Math.ceil(K[k]*FPS-1e-6)/FPS, since=(t,k)=>t-ON(k);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let BOIL=0,SID=0;const wob=()=>{const r=rng(BOIL*7919+(SID++)*104729);return()=>r()-.5};
function path(pts,j){const r=wob(),q=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],n=Math.max(2,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/30));for(let k=0;k<n;k++){const f=k/n;q.push([a[0]+(b[0]-a[0])*f+r()*j*2,a[1]+(b[1]-a[1])*f+r()*j*2])}}q.push([pts.at(-1)[0]+r()*j,pts.at(-1)[1]+r()*j]);return[q,r]}
// ink brush stroke: width tapers in/out, pressure noise, dry-brush gaps at tail; partial reveal p
function brush(pts,p=1,w=8,col=INK,j=1.4,dry=.25){if(p<=0)return;const[q,r]=path(pts,j);const n=Math.max(2,Math.round((q.length-1)*cl(p))+1),Q=q.slice(0,n);
 if(Q.length<2)return;const L=[],R=[];for(let i=0;i<Q.length;i++){const a=Q[Math.max(0,i-1)],b=Q[Math.min(Q.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  const u=i/(q.length-1),taper=Math.min(1,u*5+.25)*Math.min(1,(1-u)*3.5+.15),ww=w*taper*(1+r()*.35)/2;L.push([Q[i][0]-dy*ww,Q[i][1]+dx*ww]);R.push([Q[i][0]+dy*ww,Q[i][1]-dx*ww])}
 X.fillStyle=col;X.beginPath();X.moveTo(...L[0]);for(const v of L.slice(1))X.lineTo(...v);for(const v of R.reverse())X.lineTo(...v);X.closePath();X.fill();
 if(dry>0){X.strokeStyle=PAPER;X.lineWidth=1.2;for(let k=0;k<3;k++){const s=Math.floor(Q.length*(.55+r()*.3));if(s<Q.length-1){X.beginPath();X.moveTo(Q[s][0]+r()*w*.4,Q[s][1]+r()*w*.4);X.lineTo(Q.at(-1)[0]+r()*w*.4,Q.at(-1)[1]+r()*w*.4);X.globalAlpha=dry;X.stroke();X.globalAlpha=1}}}}
function ring(cx,cy,rx,ry,a0=-1.9,span=6.5){const o=[];for(let i=0;i<=24;i++){const a=a0+i/24*span;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return o}
function fillRing(cx,cy,rx,ry,col){X.fillStyle=col;X.beginPath();X.ellipse(cx,cy,rx,ry,0,0,7);X.fill()}
function txt(s,x,y,font,col,a=1,sx=1){X.save();X.globalAlpha=a;X.font=font;X.fillStyle=col;X.translate(x,y);X.scale(sx,1);X.fillText(s,0,0);X.restore();X.font=font;return X.measureText(s).width*sx}
// ---------- captions (word-by-word, onset-locked)
function caption(t){const segs=[[0,5],[5,8],[8,10],[10,14]];const starts=[0,2.3,4.1,6.2];let si=0;for(let i=0;i<4;i++)if(t>=starts[i])si=i;
 let x=110;const y=262;for(const[w,o,k]of CAP.slice(...segs[si])){const s=k?t-Math.ceil(o*FPS-1e-6)/FPS:t-o;if(s<0)break;const a=k?1:EO(s/.12),dy=k?-10*Math.max(0,1-s/.15)*(s<.15):(1-a)*10;
  x+=txt(w,x,y+dy,k?`italic 700 66px ${SERIF}`:`500 56px ${SANS}`,k?RED:INK,a)+8}}
function headline(t){const two=t>=4.26,[a0,b0]=two?['原因 1：','CO₂']:['蚊子为什么','只咬你'];const t0=two?4.26:.3,a=EO((t-t0)/.18);
 X.save();X.globalAlpha=a;let x=110;x+=txt(a0,x,470,`900 100px ${HEAD}`,INK,a,.84);txt(b0,x+10,470,`${two?'':'900 '}${two?'112':'100'}px ${HEAD}`,RED,a,two?1:.84);X.restore();
 brush([[106,512],[400,522],[700,516],[940,506]],EO((t-t0-.2)/.45),11,RED,2,.35)}
// ---------- stick figure with ink brush (scale 1.9, ~420 px tall)
function stick(x,y,s,pose,p=1){const P=k=>cl(p*5-k),hy=y-175*s;
 brush(ring(x,hy,30*s,31*s),P(0),9,INK,1,.2);const neck=[x,hy+32*s],hip=[x+pose.lean*s,y-62*s];brush([neck,hip],P(1),10);
 const sh=[x+pose.lean*.3*s,hy+62*s];pose.arms.forEach(([ang,len,bend=0],i)=>{const m=[sh[0]+Math.cos(ang)*len*.5*s,sh[1]+Math.sin(ang)*len*.5*s],e=[m[0]+Math.cos(ang+bend)*len*.5*s,m[1]+Math.sin(ang+bend)*len*.5*s];brush([sh,m,e],P(2),9)});
 pose.legs.forEach(ang=>brush([hip,[hip[0]+Math.cos(ang)*75*s,hip[1]+Math.sin(ang)*75*s]],P(3),10));
 if(P(4)>0){X.fillStyle=INK;for(const d of[-1,1]){X.beginPath();X.arc(x+d*10*s,hy-4*s,pose.eye*s,0,7);X.fill()}
  if(pose.mouth==='o'){brush(ring(x,hy+14*s,5*s,6*s),1,4)}else brush(pose.mouth==='sad'?[[x-9*s,hy+17*s],[x,hy+12*s],[x+9*s,hy+17*s]]:[[x-9*s,hy+12*s],[x,hy+17*s],[x+9*s,hy+12*s]],P(4),5,INK,.4,0)}
 return{arm:[sh[0]+Math.cos(pose.arms[1][0])*pose.arms[1][1]*.5*s,sh[1]+Math.sin(pose.arms[1][0])*pose.arms[1][1]*.5*s],mouth:[x+20*s,hy+14*s],head:[x,hy]}}
// ---------- props / icons
function mosquito(mx,my,flip=1){X.save();X.translate(mx,my);X.scale(1.7,1.7);X.translate(-mx,-my);brush([[mx-18*flip,my],[mx+16*flip,my+2]],1,6);fillRing(mx,my-4,8,7,RED);brush(ring(mx,my-4,9,8),1,3);brush([[mx-4,my-8],[mx-22*flip,my-28]],1,3,INK,.8,0);brush([[mx+4,my-8],[mx+12*flip,my-30]],1,3,INK,.8,0);brush([[mx+16*flip,my+2],[mx+34*flip,my+8]],1,2.5,INK,.4,0);X.restore()}
function magnifier(cx,cy,s,a){if(a<=0)return;X.save();X.translate(cx,cy);X.scale(a,a);brush(ring(0,0,46*s,46*s),1,9);brush([[32*s,32*s],[80*s,82*s]],1,15,RED,1,.2);X.restore()}
function bump(x,y,a){if(a<=0)return;fillRing(x,y,16*a,12*a,RED);for(let i=0;i<5;i++){const g=i/5*6.28-1.57;brush([[x+Math.cos(g)*28*a,y+Math.sin(g)*24*a],[x+Math.cos(g)*44*a,y+Math.sin(g)*38*a]],1,5,RED,.6,0)}}
function puff(x,y,r,al){X.globalAlpha=al;brush(ring(x,y,r,r*.8,-2.5,6.6),1,6,RED,1.4,.3);X.globalAlpha=1}
// ---------- presenter「墨丸」: ink-brush round head, brush-tip topknot tied with red cord, red seal on cheek
const MO=[[6,4],[14,10],[22,22],[18,30],[30,14]]; // mouth shapes w/h: rest, small, mid, O, wide
function presenter(t){const fi=Math.min(ENV.length-1,Math.floor(t*FPS)),env=ENV[fi]||0;
 const surprised=(since(t,'咬')>=0&&since(t,'咬')<.9)||(since(t,'二氧化碳')>=0&&since(t,'二氧化碳')<.9);
 const think=t>2.15&&t<ON('原因');const point=(since(t,'原因')>=0&&t<4.1)||since(t,'追')>=0;const wave=t>.25&&t<1.05;
 const by=Math.sin(t*Math.PI)*4,cx=780,cy=1560+by,tilt=think?-.06:0;X.save();X.translate(cx,cy);X.rotate(tilt);X.translate(-cx,-cy);
 // body (simple robe line) + arms
 brush([[cx-40,cy+215],[cx-70,cy+380]],1,12);brush([[cx+40,cy+215],[cx+70,cy+380]],1,12);
 if(wave){const g=-2.2+Math.sin((t-.25)*2*Math.PI*2.2)*.35;brush([[cx-120,cy+250],[cx-200,cy+150],[cx-200+Math.cos(g)*90,cy+150+Math.sin(g)*90]],1,11);hand(cx-200+Math.cos(g)*100,cy+150+Math.sin(g)*100)}
 else if(point){const a=EO((t-(since(t,'追')>=0?ON('追'):ON('原因')))/.18);const ex=lerp(cx-150,cx-330,a),ey=lerp(cy+330,cy+120,a);brush([[cx-110,cy+260],[ex+40,ey+40],[ex,ey]],1,11);brush([[ex,ey],[ex-38,ey-26]],1,9);}
 else if(think){brush([[cx+110,cy+260],[cx+40,cy+170],[cx+20,cy+150]],1,11);hand(cx+20,cy+145)}
 // topknot: brush tip (signature), red cord
 const sw=Math.sin(t*2.1)*.06;X.save();X.translate(cx+20,cy-215);X.rotate(sw);fillTip();X.restore();brush([[cx-6,cy-208],[cx+44,cy-214]],1,9,RED,.6,0);brush([[cx+44,cy-214],[cx+70,cy-190]],1,5,RED,.8,0);
 // head
 fillRing(cx,cy,215,200,SKIN);brush(ring(cx,cy,215,200,-1.7,6.4),1,14,INK,1.2,.35);
 // ink fringe: three brush flicks
 brush([[cx-150,cy-130],[cx-80,cy-160],[cx-10,cy-120]],1,18,INK,1.4,.4);brush([[cx-20,cy-150],[cx+60,cy-170],[cx+140,cy-120]],1,16,INK,1.4,.4);
 // seal on cheek
 X.save();X.translate(cx+130,cy+70);X.rotate(.08);X.fillStyle=RED;X.globalAlpha=.85;X.fillRect(-22,-22,44,44);X.globalAlpha=1;X.font=`700 30px ${SERIF}`;X.fillStyle=SKIN;X.textAlign='center';X.fillText('睿',0,11);X.restore();
 // brows
 const br=surprised?-18:think?-8:0;brush([[cx-115,cy-50+br],[cx-50,cy-60+br*1.2]],1,9);brush([[cx+50,cy-60+br*1.2+(think?10:0)],[cx+115,cy-50+br]],1,9);
 // eyes: ink dots (no blue), blink 3.1 s, look-up when thinking
 const bl=((t+.4)%3.1)<.1&&!surprised;for(const d of[-1,1]){const ex=cx+d*80+(think?8:0),ey=cy+5+(think?-10:0);
  if(bl)brush([[ex-22,ey],[ex+22,ey]],1,7);else if(surprised){fillRing(ex,ey,24,26,'#fff');brush(ring(ex,ey,24,26),1,6);fillRing(ex,ey,9,9,INK)}else{fillRing(ex,ey,13,16,INK);fillRing(ex+5,ey-6,4,4,SKIN)}}
 // mouth: 5 shapes from VO envelope; O when surprised
 let k=surprised&&env>.15?3:env<.08?0:env<.35?1:env<.65?2:4;const[mw,mh]=MO[k];const my=cy+105;
 if(k===0)brush([[cx-mw-6,my],[cx,my+5],[cx+mw+6,my]],1,7);else{fillRing(cx,my,mw,mh/2+2,INK);if(mh>12)fillRing(cx,my+mh/4,mw*.6,mh/5,RED)}
 X.restore()}
function hand(x,y){brush(ring(x,y,16,15),1,7)}
function fillTip(){X.fillStyle=INK;X.beginPath();X.moveTo(-30,0);X.quadraticCurveTo(-36,-70,0,-130);X.quadraticCurveTo(28,-70,30,0);X.closePath();X.fill();X.strokeStyle=PAPER;X.lineWidth=2;for(let i=0;i<4;i++){X.beginPath();X.moveTo(-14+i*9,-30);X.quadraticCurveTo(-10+i*7,-80,-2+i*2,-118);X.stroke()}}
// ---------- frame
function draw(t){BOIL=Math.floor(t*12);SID=0;X.fillStyle=PAPER;X.fillRect(0,0,W,H);X.drawImage(GRAIN,0,0);
 txt('@handle · 样片',110,148,`400 30px Menlo,monospace`,SUB);txt('原因 1/3',840,148,`700 30px Menlo,monospace`,RED);
 caption(t);headline(t);brush([[70,1229],[560,1232],[1010,1228]],1,5,GREY,.8,.2);
 if(t<4.26){const p=EO((t-.45)/.6),b=since(t,'咬'),fl=b>=0?EB(b/.3):0;
  const S=stick(470,1180,1.9,{lean:-25*fl,arms:[[2.1,90],[b>=0?-0.6:0.8,95,b>=0?-.6:.3]],legs:[1.95,1.2],eye:b>=0&&b<.9?6:4,mouth:b>=0&&b<.9?'o':t>2.2?'sad':'ok'},p);
  // mosquito: hover loop until 咬, then dive to arm in 0.12 s
  if(t>.9){let mx=700+Math.sin(t*5.3)*60,my=760+Math.cos(t*7.1)*30;if(b>=0){const d=EO(b/.12);mx=lerp(mx,S.arm[0]+30,d);my=lerp(my,S.arm[1]-20,d)}mosquito(mx,my,-1)}
  bump(S.arm[0],S.arm[1],b>=0?EB(b/.25):0);
  magnifier(820,700,1.2,EB(since(t,'原因')/.3))}
 else{const S=stick(380,1180,1.9,{lean:8,arms:[[2.3,90],[0.6,90]],legs:[1.95,1.25],eye:4,mouth:'ok'},1);
  const c=since(t,'二氧化碳');for(let i=0;i<3;i++){const ph=cl((c-i*.18)/1.1);if(c-i*.18>=0)puff(S.mouth[0]+40+ph*300,S.mouth[1]-ph*120,20+ph*44,1-ph*.6)}
  txt('CO₂',S.mouth[0]+110,S.mouth[1]-150,`120px ${HEAD}`,RED,c>=0?EO(c/.12):0);
  const z=since(t,'追'),arr=z>=0?EO(z/.45):0,mx=lerp(960,S.mouth[0]+90,arr),my=lerp(640,S.mouth[1]-60,arr)+Math.sin(t*9)*12;
  if(z>=0)brush([[980,620],[860,600],[700,680],[S.mouth[0]+110,S.mouth[1]-70]],arr,8,RED,2,.3);mosquito(mx,my,1);
  const a=EB((t-4.3)/.3);txt('1',95,1530,`${Math.round(240*cl(a,0,1.2))}px ${HEAD}`,INK,cl(a));txt('/3',210,1530,`italic 400 70px ${SERIF}`,RED,cl(a));brush([[110,1575],[330,1580]],EO((t-4.5)/.3),6,RED,1,.2)}
 presenter(t)}
const GRAIN=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),d=g.createImageData(W,H),r=rng(7);for(let i=0;i<d.data.length;i+=4){const v=r()<.5?0:255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=r()*7}g.putImageData(d,0,0);return c})();
window.render=draw;document.fonts.load('100px Anton').then(()=>document.fonts.ready).then(()=>{window.READY=true});
</script></body></html>
