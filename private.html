<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="data:,">
<title>私藏风格</title><style>
:root{--bg:#e6eaee;--paper:#f8f9fb;--ink:#1b1f24;--muted:#46505a;--line:#d3d8de;--accent:#0e4d5c;--frame:#121416}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "WenQuanYi Micro Hei","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:36px 40px 8px}
h1{margin:0;font-size:2.5rem;line-height:1.1;letter-spacing:-.03em}
.lead{margin:8px 0 0;color:var(--muted)}
#status{padding:14px 40px 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:22px;padding:18px 40px 40px}
.card{background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 12px 28px rgba(18,22,27,.08);display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:#121416;display:block}
.cb{padding:14px 16px 16px}
.cn{margin:0 0 6px;font-size:1.15rem;font-weight:700}
.ln{margin:0;color:var(--muted)}
.meta{display:flex;gap:8px;margin-top:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;color:var(--muted)}
button.watch,button.x{font:inherit;cursor:pointer}
button.watch{margin-top:12px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:6px 14px}
#dlg{position:fixed;inset:0;background:rgba(18,22,27,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
#dlg.on{display:flex}
.pan{background:var(--paper);border-radius:20px;max-width:880px;width:100%;padding:22px 22px 28px;position:relative}
.pan h2{margin:0 40px 12px 0;font-size:1.6rem}
.pan video,.pan img.cover{width:100%;border-radius:12px;background:#121416;display:block}
.x{position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;border-radius:999px;background:var(--bg)}
.note{margin:12px 0 0;color:var(--muted)}
@media(max-width:640px){header,#status,.grid{padding-left:16px;padding-right:16px}h1{font-size:2rem}.pan{padding:22px 16px 24px}}
</style></head><body>
<header>
  <h1>私藏风格</h1>
  <p class="lead">自己的样片。</p>
</header>
<div id="status"></div>
<div class="grid" id="grid"></div>
<div id="dlg"><div class="pan" id="pan"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let STYLES=[];
function clean(text){return String(text||"").replace(/https?:\/\/\S+/g,"").replace(/\s+/g," ").trim()}
function statusLabel(status){return status==="approved"?"已认可":status==="draft"?"草稿":(status||"")}
function stopVideo(){document.querySelectorAll("#pan video").forEach(v=>{try{v.pause()}catch(e){}v.removeAttribute("src");try{v.load()}catch(e){}})}
function card(s){
  const img=s.poster?`<img src="${esc(s.poster)}" alt="" loading="lazy">`:'<div class="ph"></div>';
  const watch=s.video?"看片":"看图";
  return `<article class="card" data-slug="${esc(s.slug)}" tabindex="0">${img}<div class="cb"><p class="cn">${esc(s.cn||s.slug)}</p><p class="ln">${esc(clean(s.line_cn||s.line||""))}</p><div class="meta"><span class="pill">${esc(statusLabel(s.status))}</span></div><button type="button" class="watch">${watch}</button></div></article>`;
}
function openS(slug){
  const s=STYLES.find(x=>x.slug===slug);
  if(!s) return;
  stopVideo();
  const media=s.video?`<video controls controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline preload="metadata" oncontextmenu="event.preventDefault()" poster="${esc(s.poster||"")}" src="${esc(s.video)}"></video>`:(s.poster?`<img class="cover" alt="" src="${esc(s.poster)}">`:"");
  const note=s.slug==="anatomy-iso-object"?"这张海报是别人的示例截图，不是我们的成片。":"";
  $("#pan").innerHTML=`<button class="x" type="button">×</button><h2>${esc(s.cn||s.slug)}</h2>${media}<p class="ln">${esc(clean(s.line_cn||s.line||""))}</p>${note?`<p class="note">${esc(note)}</p>`:""}<p class="meta"><span class="pill">${esc(statusLabel(s.status))}</span></p>`;
  $("#dlg").classList.add("on");
  const video=$("#pan video");
  if(video){const playing=video.play();if(playing&&playing.catch)playing.catch(()=>{})}
}
function closeD(){$("#dlg").classList.remove("on");stopVideo()}
document.addEventListener("contextmenu",ev=>{const v=ev.target&&ev.target.closest&&ev.target.closest("video");if(v)ev.preventDefault()},true);
$("#grid").onclick=ev=>{const card=ev.target.closest("[data-slug]");if(!card)return;openS(card.getAttribute("data-slug"))};
$("#dlg").onclick=ev=>{if(ev.target.id==="dlg"||ev.target.classList.contains("x"))closeD()};
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeD()});
fetch("library.json",{cache:"no-store"}).then(r=>r.json()).then(lib=>{
  STYLES=lib.styles||[];
  $("#status").textContent="共 "+STYLES.length+" 条";
  $("#grid").innerHTML=STYLES.map(card).join("")||"<p>没有样片。</p>";
}).catch(()=>{$("#status").textContent="样片没有载入。"});
</script></body></html>
