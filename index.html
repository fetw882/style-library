<title>风格库</title><style>
:root{--bg:#120f10;--card:#1d191a;--line:#2e2829;--tx:#f5efe2;--mu:#a59d92;--ac:#e7bc27;--cy:#3be6d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}

.tabs{display:flex;gap:8px;margin-left:auto}.tab{background:none;border:1px solid var(--line);color:var(--mu);padding:8px 18px;border-radius:20px;cursor:pointer;font-size:14px}
.tab.on{color:#130f10;background:var(--tx);border-color:var(--tx)}
#status{padding:6px 32px;color:var(--mu);font-size:12px}#status b{color:var(--cy);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px;padding:16px 32px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#5a4f46}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.ph{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--mu);background:#000}
.cb{padding:12px 14px 14px}.cn{font-size:17px;font-weight:600}.en{color:var(--mu);font-size:12px}
.ln{font-size:13px;color:#d8d0c3;margin:6px 0 8px}.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.pill{border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mu)}.pill.ok{color:var(--cy);border-color:#1f6e66}
.new{animation:fl 2s}@keyframes fl{0%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:none}}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;overflow:auto;padding:32px 16px}#dlg.on{display:block}
.pan{max-width:980px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 28px}
.pan video{width:100%;border-radius:8px;background:#000}.x{float:right;background:none;border:0;color:var(--mu);font-size:26px;cursor:pointer}
.say{display:flex;gap:10px;align-items:center;background:#130f10;border:1px dashed #5a4f46;border-radius:8px;padding:10px 14px;margin:14px 0}
.say code{flex:1;color:var(--ac)}.say button{background:var(--ac);border:0;border-radius:6px;padding:6px 14px;cursor:pointer}
.dt{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}.md{background:#151213;border-radius:8px;padding:6px 20px;margin-top:8px;font-size:14px;overflow-x:auto}
.md table{border-collapse:collapse;font-size:13px}.md td,.md th{border:1px solid var(--line);padding:4px 8px}.md code{color:var(--cy)}
.md h1{font-size:20px}.md h2{font-size:16px;color:var(--ac);margin-top:20px}.src{color:var(--mu);font-size:12px;margin-top:12px}a{color:var(--cy)}

.tabs{overflow-x:auto;max-width:100%;padding-bottom:4px}.tab{white-space:nowrap}
.note{display:none;padding:10px 32px 0;color:var(--mu);font-size:13px}
.note.on{display:block}.note strong{color:var(--ac);font-weight:600}
.tools{display:none;gap:8px;align-items:center;padding:10px 32px 0;flex-wrap:wrap}
.tools.on{display:flex}
.tools input,.tools select{background:#130f10;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.tools input{flex:1 1 180px;min-width:0}
.pager{display:none;gap:10px;justify-content:center;align-items:center;padding:0 32px 36px;color:var(--mu)}
.pager button:disabled{opacity:.4;cursor:default}
.card.ref{cursor:pointer}.card.ref .ph{aspect-ratio:16/9;min-height:0;background:#241f20;overflow:hidden}.card.ref .ph img{width:100%;height:100%;object-fit:cover;display:block}.thumb-miss{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mu);font-size:13px;text-align:center;padding:12px}.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.mini{background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:2px 8px;cursor:pointer;font:inherit;font-size:12px}
@media(max-width:640px){header,.note,.tools,#status,.grid,.pager{padding-left:14px;padding-right:14px}h1{font-size:22px}.grid{grid-template-columns:1fr}.tabs{margin-left:0;width:100%;flex-wrap:wrap;overflow:visible}.tab{padding:6px 12px}}

<script id="snapshot" type="application/json">{"library": {"hash": "a19bb98ce1e0", "count": 7, "styles": [{"slug": "anatomy-iso-object", "en": "Anatomy Iso Object", "cn": "机关讲解 Anatomy", "based_on": "Anatomy skill by Ryan (https://github.com/wheresryan22/anatomy, MIT License, Copyright (c) 2026 Ryan)", "borrows": ["concept-as-working-object metaphor (the machine IS the explanation)", "isometric solids with four-tone shading, halo under base, 0.6px lines, one lit accent", "framed card: Fig n / title / hint / live readout in the four corners", "calm eased motion (exponential follow, real springs, idle tour)", "every number from one small model that also drives the parts", "self-verification by zooming into every joint (line ends, painter's order, audit)"], "size": "1080x1920 or 1920x1080", "test_size": "n/a (test.mp4 pending, to be rendered on the Mac mini)", "fps": 30, "library_version": "n/a (own adaptation of an MIT project)", "created": "2026-11-03", "status": "draft", "line": "Explain a concept by building it as a real, working isometric machine of dozens of small shaded parts, in a framed card with a figure number, a hint and a live readout driven by the same model.", "line_cn": "把概念造成一台真实可运转的等轴测小机器：几十个带明暗的零件、Fig 图题框卡、实时读数与零件同源，缓慢惯性运动。", "source": "https://github.com/wheresryan22/anatomy — MIT License, Copyright (c) 2026 Ryan. demo/ keeps the original LICENSE; test.jpg/styleframe.jpg are screenshots of the project's own examples (dial-indicator-light, raptor-engine-light).", "license": "MIT (see demo/LICENSE). Fonts: system monospace + sans in the original; for Chinese films use our OFL fonts.", "audio": "none", "dir": "anatomy-iso-object", "poster": "anatomy-iso-object/test.jpg", "video": null, "styleframe": "anatomy-iso-object/styleframe.jpg", "md": {"STYLE.md": "# Anatomy Iso Object 机关讲解 — Style Prompt\n\n> 一个概念 = 一台能转起来的真机器。看懂机器，就懂了概念。\n> 来源：https://github.com/wheresryan22/anatomy （MIT，Copyright (c) 2026 Ryan）。我们只学它的方法和质感，物体每片重新发明，不照搬它的示例物体。\n\n## 1. Essence, and what it is not\n- 核心不变量：**物体就是解释**。先找一台真实存在、一眼能叫出名字的机器/仪器/家具，它的运转方式和概念一一对应（例：缓存键命中＝弹子锁所有销对齐才转动；一个 GPU 上下文服务多个画布＝一个打印头巡访 16 个孔的龙门绘图机）。必须能用一句话说清「什么在动、动代表什么」。\n- 不是：方块+箭头+标签的流程图；漂浮的「层」板子；一整块平板上画几条线；蓝图风（引线、编号气泡、尺寸箭头、虚线隐藏边）；线框透视；满屏彩色。\n\n## 2. Materials & rendering\n- 等轴测实体：默认方位 45°（35–60° 让承载机构的面朝向观众），仰角 30°（要看进容器内部可抬到 ~44°）。\n- **零件密度**：一张图 40–80 个零件（主体复杂时 80–150）；密度来自结构（脚、导轨、限位块、衬套、旋钮、螺丝、刻度尺、铭牌），不来自纹理。每个零件都坐在另一个零件上、和邻居对齐、有用途。\n- **两层看**：1× 一眼是一台清楚的机器；放大 4× 每个区域仍有真东西可看。空白面＝没做完。\n- **明暗**：每个实体有真实厚度，侧面四档明暗（相邻约 3% 亮度差，很克制），顶面最亮，主板有倒角高光，底座下有柔和晕影。\n- 线条：细线 ~0.6 px（@600 宽画布），每根线必须落在面、线或端点上，不许悬空断；纹理（螺栓点、肋条、刻度）要么止于真实边缘，要么淡出，绝不半路硬停。\n- 绘制顺序：后→前、下→上；包裹件（弹簧、框架）拆前后两半；管线逐段按深度排。\n\n## 3. Colour logic（分层：主件 / 辅件 / 背景）\n- 单色为主，色值全部走 token（浅色主题优先，深色是可选）。\n- 背景层：纸色卡片＝填充色，`lo` 给底座、脚、地面；`faint` 给凹槽、内嵌线、地面网格。\n- 辅件：结构（立柱、导轨、框架、滑台、外壳）用 `mid`。\n- 主件：被解释的东西用 `hi`；**此刻要看的那一个**用 `lit`（白边+更亮顶面），全图只有一个。\n- 颜色只在「颜色本身就是主题」时出现；液体也是本图墨色的淡染，不另起饱和色。\n\n## 4. Type & subtitles（框卡版式）\n- 机器放在一张框卡里，占卡面 55–65%，四角不被碰到：左上 `Fig n`，右上短标题（等宽大写字距拉开），左下交互/操作提示，右下**实时读数**（短、带真实单位，如 `block 1 · reads 18.0 px`）。\n- 图例和一句真实图注放在卡片下方；画面里最多一个刻在零件面上的小铭牌字，其余文字一律不进画面。\n- 字体：角标/读数用等宽体；图注用无衬线。中文片角标与读数用等宽或得意黑，图注/字幕用霞鹜文楷（均 OFL，见 film 规则），字号守导演下限。\n\n## 5. Motion quality\n- 时间驱动不按帧步进；所有运动朝目标指数缓动（τ≈0.1–0.3 s）或真实弹簧（真实刚度/阻尼）——有重量、有惯性，绝不瞬移贴光标。\n- 缓慢、可跟随；一次只动一个主件。无人操作时跑一段「闲置巡演」把要点演一遍。\n- **数字与模型同源**：读数、指针、零件位置全部来自同一个小纯函数模型；读数从「零件此刻实际在哪」取值，相位词和数字取自同一瞬间，绝不各算各的。查不到的真值不写（不编数据）。\n\n## 6. Camera grammar\n- 交互原版：相机固定，等轴测，物体居中。改成影片时见 §12。\n\n## 7. Sound palette\n- 原项目无声。成片沿用我们的规则：BGM 全程不断，−14 LUFS，真峰值 ≤ −1.5 dBTP；机械音效（咔哒、齿轮、弹簧）只在关键零件动作点加，轻。\n\n## 8. Native moves\n- 滑台滑动、指针转到读数、柱塞随高度起落。\n- **拆解展开（exploded view）**：各总成沿装配轴错峰弹开、再合拢，全程逐帧重排深度。\n- 主件变 `lit`（视线锚点切换）。\n- 读数随零件实时变化。\n\n## 9. Pitfalls of the medium\n- 太抽象（叠板）或太平（一块大板）——同一个解法：换成真实机器 + 更多小零件。\n- 管线穿过管线/实体、线头悬空、纹理半路停、曲面阶梯色块——放大 4× 都会露馅。\n- 为了一张截图手调深度顺序，结果别的帧坏掉——先量再看。\n- 读数和指针不同源，出现矛盾数字。\n\n## 10. Engine\n- 纯代码：原项目 Node（零依赖）生成 SVG 单页，`kit/iso-kit.mjs` 提供实体/圆柱/刻度/旋钮/弹簧等原语；流体、光、焦散用 WebGL 层夹在前后两层 SVG 之间；可选 3D 模式。\n- 自检（不变量）：做完逐个关节放大到 4× 截图并看；线头检查为 0；有管线/圆件时审计 0 失败；手机宽度 390 仍可读；无控制台报错。\n- 成片渲染：每帧是 t 的纯函数，用户规则（2026-11-01）**正式渲染只在 Mac mini 上做**。\n\n## 11. Variation space / known gaps for next version\n- 尚无竖屏影片实测（test.mp4 待 Mac mini）；\n- 中文角标/读数的等宽中文字体待定；\n- 深色主题与我们其他风格的衔接待试；3D 模式是 beta，先不用于成片。\n\n## 12. 改成动画短片时怎么用\n- **镜头跟零件走**：用等轴测相机做缓慢环绕（方位角在 35–60° 内摆动）、缓推到当前 `lit` 零件、退远看整机；不做硬切，换镜靠零件形状/运动延续。\n- **零件逐个出场卡口播**：底座→结构→机构→读数，按装配顺序落位（带轻微弹性落下）；**口播关键词出现的那一帧，对应零件立刻动**（±1 帧，变化必须肉眼明显），同时该零件切为 `lit`。\n- **拆解展开讲结构**：讲「由什么组成」时整机错峰炸开成总成，逐个点名、再合拢；合拢那一下卡在句尾/重拍。\n- **读数翻牌**：右下读数随模型滚动或翻牌，数字只来自同一个模型和查实的资料，查不到不写。\n- **竖屏 1080×1920**：框卡占上 2/3，Fig/标题在上，读数在下，字幕在卡片下方安全区；**横屏 1920×1080**：机器居左 60%，图注/字幕在右栏。\n- **节奏放慢**：一句一个零件动作，留呼吸；运动全部带惯性。\n- **不要像 AI 做的**：零件要能叫出名字、每根线落地、无乱码贴图、无滤镜光效堆砌；一个高亮色以内。\n- **无广告**：不出现品牌 logo、带货口播或二维码；不用任何人的 logo 或真实照片。\n", "CHANGES.md": "| Section | Base (Anatomy, MIT © Ryan) | Now (ours) | Why |\n|---|---|---|---|\n| §4 type | English mono corner labels | 中文角标/字幕用 OFL 字体，守字号下限 | 中文科普片 |\n| §5 motion | pointer/keyboard + idle tour | 口播关键词那一帧对应零件立刻动并变 lit | 用户铁律 |\n| §6 camera | fixed iso camera | 缓慢环绕/推近 lit 零件/拆解展开 | 交互图改成影片 |\n| §7 sound | silent | BGM −14 LUFS，轻机械音效 | 我们的成片规则 |\n| §10 engine | browser capture | 每帧纯函数，正式渲染只在 Mac mini | 用户规则 2026-11-01 |\n", "DEMO.md": "# DEMO — 机关讲解 Anatomy（draft）\nOne example among many. Don't reuse its object, story or numbers.\n\n- demo/：原项目最小示例 dial-indicator（百分表在测量台上，滑台带三块量块 18/14/10，指针一圈=20 px）源码，外加它必需的 `kit/iso-kit.mjs`、`scripts/inline-kit.mjs`；`demo/LICENSE` 为原项目 MIT 全文（Copyright (c) 2026 Ryan）。\n- 运行：`bash demo/build.sh` → 生成 `demo/examples/dial-indicator/dial-indicator(-light).html`（已验证与原项目产物逐字节一致；生成物不入库）。\n- test.jpg：原项目 `examples/dial-indicator/dial-indicator-light.html` 的 Chrome 静态截图（来源 https://github.com/wheresryan22/anatomy ，MIT）。\n- styleframe.jpg：原项目 `examples/raptor-engine/raptor-engine-light.html` 的静态截图（同上来源）。\n- **test.mp4：待 Mac mini 上线后在 Mac mini 渲染**（用户规则：渲染只在 Mac mini 做），本条目暂无视频。\n"}, "demo_files": ["LICENSE", "build.sh", "examples", "kit", "scripts"]}, {"slug": "brand-title-opener", "en": "Brand Title Opener (contrast slot-wheel)", "cn": "厂牌滚轮片头", "based_on": "none (own brand opener, code-only Canvas 2D; grew out of the slot-wheel title in our pixel-rpg-25d-explainer film v7)", "borrows": ["Slot-wheel title move from our own《如果你的反应快10倍》v7 opener (own work)"], "size": "1920x1080 (16:9) or 1080x1920 (9:16)", "test_size": "960x540", "fps": 30, "library_version": "n/a (own style, not derived from a library style)", "created": "2026-11-10", "status": "approved", "approved": "2026-11-10", "approved_by": "owner, 2026-11-10 15:28 Asia/Shanghai: 「可以，如果以后需要最后滚动的关键词不是数字，的时候更好用，都记下来，给风格库」 (v3 contrast-then-spin-back approved)", "line": "A 5-second brand opener: the first half of the title types on the beat, the cursor morphs into a selection band, the wheel rolls past the theme word, rests on a contrast word, spins back and locks the theme word in brand yellow on the music drop. The theme word can be a number (10倍) or any word (暂停).", "line_cn": "5 秒厂牌片头：前半句踏拍打出，光标变成选中带，滚轮滚过主题词、停在反差词上一拍，再旋回主题词在音乐落点锁定变黄；主题词可以是数字（10倍）也可以是词（暂停）。", "source": "Own work: newbeer.lee brand opener v3 (2026-11-10), from the v7 film opener of《如果你的反应快10倍》; direction approved by the owner.", "license": "Fonts, all SIL OFL 1.1: Fusion Pixel 12px (github.com/TakWolf/fusion-pixel-font), ZCOOL KuaiLe 站酷快乐体 (github.com/googlefonts/zcool-kuaile), Smiley Sans Oblique 得意黑 (github.com/atelier-anchor/smiley-sans), Noto Serif SC Black 思源宋体 and Noto Sans SC Black 思源黑体 (github.com/notofonts/noto-cjk), Noto Sans Mono CJK SC (signature). SFX: synthesised in code (sfx.py), no third-party audio.", "audio": "public test.mp4 has no BGM: synthesised SFX only (the public site strips the audio track as well). The internal-review song 'We Never' has no licence proof and is not in this library.", "test_content": "test.mp4 = number example (如果你的反应快 2倍…10倍 → 反差 1倍 → 锁定 10倍, pixel skin) + word example (如果你能 加速…暂停 → 反差 加速 → 锁定 暂停 + 时间, data skin), both 16:9, no BGM, 10.2 s", "params": "--prefix --values (last item = theme word, number or word) --contrast --suffix --sub --drop --skin --aspect; --from/--to/--unit is only a shortcut for number lists", "skins": ["pixel", "cartoon", "data", "cinema"], "motion_gate": "self-score 65.8 (<90), not a gate-passed film system", "dir": "brand-title-opener", "poster": "brand-title-opener/test.jpg", "video": "brand-title-opener/test.mp4", "styleframe": "brand-title-opener/styleframe.jpg", "md": {"STYLE.md": "# Brand Title Opener 厂牌滚轮片头 — Style Prompt\n\n> newbeer.lee 的厂牌片头：前半句踏拍逐字打出 → 光标变成选中带 → 滚轮滚**过**主题词 → 落在**反差词**上停稳一拍（被否定的选择）→ 反向**旋回主题词** → 在音乐落点 D 锁定变黄 → 定格 1 秒 → 统一退场交给正片。\n> **主题词是参数：可以是数字（「10倍」），也可以是词（「暂停」「永远」）。两种写法同等地位，同一套引擎、同一套时间、同一个锁定动作。**\n> 来源：自家片《如果你的反应快10倍》v7 片头滚轮（2026-11-10）→ 本条目 v3（用户 2026-11-10「10倍这里做一个反差选择，最后旋转回我们的主题词」；「可以，如果以后需要最后滚动的关键词不是数字，的时候更好用，都记下来，给风格库」）。\n> 本文只写不变量。逐帧数值以本文为准；demo/ 里的引擎是同源实现。\n\n## 1. Essence, and what it is not\n- 一个 5 秒左右的**厂牌片头动作**，不是某一部片子的标题。任何片子都能套：换前半句、换词表、换主题词、换皮肤、换 D，动作不变。\n- 核心戏剧：观众先看到一个**错误/相反的选择**被摆上来（反差词停稳可读），然后滚筒**反转**回到主题词，在重拍上「砰」地锁定——「不是这个，是**这个**」。\n- **动画逻辑所有片子共用，只换皮肤**（pixel / cartoon / data / cinema，可新增）。节奏、阶段、卡点、版式、选中带、锁定高亮、签名位置一律不随皮肤变。\n- 主题词两种形态（**一等用法，任选其一**）：\n\n| | 数字例 | 词例 |\n|---|---|---|\n| 前半句 `--prefix` | 如果你的反应快 | 如果你能 |\n| 词表 `--values`（**末项 = 主题词**） | 2倍,3倍,4倍,5倍,6倍,7倍,8倍,9倍,10倍 | 加速,倒流,跳过,复制,暂停 |\n| 反差词 `--contrast` | 1倍 | 加速 |\n| 后缀 `--suffix` | （无） | 时间 |\n| 锁定后读作 | 如果你的反应快**10倍** | 如果你能**暂停**时间 |\n\n- 不是：数字计数器（词表可以全是词）；老虎机/抽奖（结果不随机，主题词是写死的答案）；过冲回弹（v2 的过冲段已作废）；花字模板（没有逐字飞入、没有渐显半字）。\n\n## 2. Materials & rendering\n- 纯代码：Canvas 2D，每帧是 t 的纯函数（单一时钟、固定随机种子、无 setTimeout/CSS 动画）；Chromium 无头逐帧截图 → ffmpeg H.264 CRF18 yuv420p bt709。\n- 画面层：背景（皮肤）→ 前半句 → 滚轮框（框底 + 导轨 + 端盖 + 上下渐隐遮罩 + 选中带）→ 滚轮行 → 锁定冲击（闪白、外扩环、粒子、光晕）→ 后缀/副标题 → 签名。\n- 滚轮行：行距 1.10×字号；邻行透明度 α(d)=1−0.55|d|（|d|≤1），再往外线性到 1.6 行消失；缩放 1−0.10·min(|d|,1.5)，纵向再乘 cos(0.42·min(|d|,1.6))（滚筒透视）；框内上下各 0.50×字号线性渐隐。\n- 运动模糊：0.4 帧快门（144°）7 次采样，**先各自画到临时层再加法平均**（静止帧与单次绘制完全相同，不变暗）；只有快门内实际位移 >1.6 px（×min(W,H)/1080）才开。\n- 框：内宽 = max(全部词 + 反差词) + 2×0.12×字号；内高 2.30 行距；选中带高 1.07 行距，上下两条线，Bo→D 线条以 0.8 s 周期呼吸（0.80±0.20）。\n- 环境层（背景网格/颗粒/圆点）运动幅度 ≤ 主层 15%。\n\n## 3. Colour logic\n- 每个皮肤有：背景、正文、出字热色、accent（光标/选中带/下划线/签名里的点）、**锁定黄**、白热、光晕、框底、导轨四段、闪白、色差两色、粒子、签名色。\n- **锁定色恒为黄色系，色相约 40–52°，全片最高亮的暖色——这是厂牌识别色。** 锁定前（含反差停顿期）字行里不允许出现锁定黄。\n- 现值：pixel #FFE859 / cartoon #FFD23F / data #FFD95A / cinema #F2C45A（锁定字填充可按皮肤做渐变，但落点必须在这个色相段）。\n- 出字热色：出现帧 75% 热色，约 0.2 s 后常驻 22%（前半句一直略带颜色，不回到平白）。\n- 反差词：用普通滚轮行颜色（22% 热色），**不变黄**；它落定时选中带线条暗 25%，表示「不是它」。\n\n## 4. Type & subtitles\n- 字体全部 SIL OFL 1.1：pixel = Fusion Pixel 12px（字号取 12 倍数，缩放/位移量化 1/24 字号）；cartoon = 站酷快乐体 ZCOOL KuaiLe；data = 得意黑 Smiley Sans Oblique；cinema = 思源宋体 Noto Serif SC Black；备用思源黑体 Noto Sans SC Black；签名 Noto Sans Mono CJK SC。来源与版本见 demo/FONTS.md。\n- 版式（1080 基准，其它分辨率按 min(W,H)/1080 等比）：\n  - 16:9 单行：主字号 180 px；整行（前半句 + 0.16FS + 主题词×1.04 + 后缀）≤ 0.88W，超了自动缩字号；行中心 y=0.437H；**整句按锁定后的最终全句（主题词宽度）水平居中**，后缀出现不重排。\n  - 9:16 两行：可用宽 W−240；第 1 行前半句 FS1=min(120, 840/字数)，行中心 0.38H；第 2 行滚轮 + 后缀，FS2=1.30×FS1，**框顶 = 第 1 行字底 + 0.15×FS1**；全部在 y 360–1420 安全带内，签名右缘避开右侧 120 px 平台按钮区。\n  - 滚轮字左对齐在 xw = 前半句末 + 0.16×字号；所有值（包括比主题词短的反差词）共用左缘，锁定字紧贴前半句。\n- **整字原则**：字永远不透明度 1，一帧整字出现，入场只用缩放与下坠（s 1.28 → 0.958 → 1.019 → 1.00，上跳 −8% 字号后沉降，约 0.15 s 落稳），无渐显、无半字、无旋转；新字先画、旧字后画（放大的新字不盖前一个字）。\n- 主题词与反差词的长度：**可以是任何字数的词或数字+单位**；框宽按最宽词自动算。词例里词长尽量一致（2 字词最好），否则滚动中框会显得空。\n- 副标题 `--sub`：D+0.35 s 起逐字，0.6×主字号。后缀 `--suffix`：D+0.12 s 起逐字，接在锁定字（按 1.04 放大后）右缘 + 0.02×字号。\n- 签名：小写 `newbeer.lee`，「.」用 accent 色（唯一品牌色点），其余签名色，整体透明度 0.60，34 px；16:9 右缘 W−96、基线 H−80；9:16 右缘 W−140、基线 1400。\n\n## 5. Motion quality\n阶段（时间一律从锁定时刻 D 倒推；D = round(drop×fps)/fps）：\n\n1. **光标**：CurOn 出现，0.10 s 长到满高；宽 0.08×字号、高 0.86×字号，accent 色；未打字时踏拍硬闪（拍点亮、半拍灭），开始打字后常亮，每出一字跳到末字右缘 + 0.04×字号。\n2. **前半句逐字踏拍打出**：每字落在音乐网格点（有拍点表用拍点表，无则从 D 往回按 4/4、默认 112.7 BPM 铺网格，D 视为强拍）；细分优先 8 分 → 16 分 → 16 分三连 → 32 分；首字尽量落强拍；**一帧最多一个字**；打字 tick 落在精确拍点，画面取最近帧（误差 ≤ ½ 帧）。\n3. **光标 → 选中带变形 + 框展开**（Bo → Rs，OPEN 0.16 s，可压到 0.12）：光标矩形 lerp 成选中带矩形，框高从带高展开到框高，内容过半才出现起始值。容器先开、内容后进。\n4. **正滚**（Rs → Rc，ROLL3 = 1.03 s）：p 从 0 二次减速到 N+1（N = 主题行 = 词表末项，N+1 = 反差行）；棘轮 p = b − K·sin(2πb)/(2π)，K = 0.35·(1 − smoothstep(0.8,1,u))；**第一次经过主题词时不停死**（棘轮仍在，速度不为 0）。\n5. **反差停顿**（Rc → Rh，CHOLD = 0.19 s）：反差词在选中带正中静止**可读 ≥6 帧**（30 fps）。**不变黄、不闪白、不屏震、不响锁定冲击**；选中带「紧一下」（高度最多收 6%，0.16 s 回原，线条暗 25%）。\n6. **旋回**（Rh → D，BACK = 0.16 s）：反向滚回主题行，τ = ((t−Rh)/BACK)^1.4，p = N+1 − (1 − (1−τ)²(1 − 2τ))；起步 1 帧蓄力，30 fps 下至少 2 个运动帧、1 个中间位帧，邻行入画、运动模糊开——**是滚筒反转，不是跳切、不是淡入**；到位回弹 3.7% 行距（<8%），D 帧 p 恰好 = N、速度 0。\n7. **锁定**（D，30 fps 第 j 帧）：闪白 0.14·e^(−j)（j<4）；屏震 y [8,−5,3,−1.5,0.5,0]、x [−3,2,−1,0.5,0,0] px@1080；色差 6·e^(−j/1.3) px；字色 mix(白热, 锁定黄, easeOutQuad(j/4))（j2 过半、j4 满黄）；缩放 1.04 + 0.08·e^(−j/2)·cos(0.8j)，**以字左缘为锚**；外扩环 0.35×字号·easeOutCubic(j/10)；粒子 12 颗、寿命 14 帧、最远 <画面 1/3；光晕 α 0.18+0.37e^(−j/4)，j>12 后以 1.2 s 周期 ±0.04 呼吸。框体退场：j0 选中线闪成锁定色 → j1–5 淡出；j0–6 框底与遮罩淡出；邻行 j0–3 淡出；j1–9 导轨/端盖外移 14 px 淡出。最后只剩字和常驻光晕。\n8. **签名**：D+0.10 s 起 0.30 s 从左向右遮罩擦出（easeOutCubic），不发声。\n9. **定格** HOLD = 1.00 s → **统一退场** X0（或 `--exit-at`）0.50 s：按 前半句→锁定字→后缀→副标题 逐字向基线压扁（间隔 min(0.025, 0.28/(字数−1)) s，每字 0.20 s）；accent 下划线从中心伸到整行再收成一点；光晕淡掉、签名反向擦掉；E 帧起纯背景，正片硬切接上（E 尽量落拍）。\n\n**时间不变量**\n- **锁定 D 由这部片子的音乐落点决定**（样片 D=3.30 s / 30fps f99 只是例子）；音画差 ≤ ½ 帧。\n- Rs→D 约 1.38 s（三段：1.03 + 0.19 + 0.16）；**可见滚动（起转到反差词落定）≥1.0 s，不可再压**。\n- 反差停顿尽量盖住 D 前一拍（样片 3.06 s 拍落在停顿内）。\n- 时长不够时的压缩顺序（每步都试排，首字落到强拍就停）：OPEN 0.16 → 0.14 → 0.12 → CHAR_SETTLE 0.10 → 0.067 → 光标先闪 1 拍 → 0 → ROLL3 0.95 → BACK 0.15；仍放不下就报错（片头前加静音/黑场，或换更晚的重拍），不偷偷挤字。\n- 打字弹出曲线、锁定冲击表、版式网格、选中带尺寸、签名位置按上文数值，不随片子改。\n\n## 6. Camera grammar\n- 镜头锁死不动：唯一的「镜头」感是锁定 j0–j5 的屏震。不推不拉不摇。\n- 已知缺口（见 §11）：动效闸门要求的镜头语言、铺垫拍在这个片头里没有做，评分因此 <90。若某部片需要镜头运动，只能加在整个片头外层（不改内部时刻），并在该片自己的文档里记录。\n\n## 7. Sound palette\n全部代码合成（48 kHz），**声音第一个采样 = 画面事件那一帧的起点，偏移 0 ms**：\n- 打字 tick：每字一声（2.5–5 kHz 带通噪声 + 2400 Hz 正弦，30 ms，−12 dBFS，声像随字 x 在 ±0.3 间）。\n- 框展开 whoosh：Bo，400→2500 Hz 上扫，−24 dB。\n- 正滚过格 tick：越过 1..N 每格一声（1200·1.02^(k−1) Hz，−16 → −11 dB 渐响）；第 N 声 = 主题词经过。\n- 反差落定 `nope`：800 Hz 闷 tick（−15 dB）+ 35 ms 后 520→700 Hz 小上滑「?」（−24 dB）——被否定的选择。\n- 旋回：Rh 处 2800→900 Hz 下扫 whoosh（−22 dB，长 = BACK）；反向越回 N 一声 tick。\n- 锁定 impact：只在 D（次低频 70→45 Hz + 噪声瞬态 + 1760/2637 Hz 铃尾，0.9 s，−6 dB）。\n- 后缀 / 副标题 tick −16 / −18 dB；退场 whoosh 2500→500 Hz（−26 dB）；E−1 帧 880 Hz blip（−22 dB）。\n- 总线峰值压到 −1 dBFS。接 BGM 时：歌约 −12 dB，D−0.03 → D+0.45 再闪避约 −5 dB 给 impact 让位，限幅器要补偿前瞻延迟（否则整轨推后 5 ms）；成片按 lemo 流程到 −14 LUFS。**配乐必须有授权证明才能用于对外版本。**\n- 本库公开 test.mp4 **无 BGM、仅合成音效**（且公开站会再剥掉音轨）。内审样片用过的 We Never 无授权证明，未入库。\n\n## 8. Native moves\n1. **反差选择 → 旋回主题词**（本条目的签名动作）：滚过主题词 → 反差词停稳可读 → 反转回主题词 → D 锁定。\n2. **主题词参数化**（数字和词同等）：\n   - 主接口：`--prefix --values --contrast --suffix --sub --drop --skin --aspect`（另有 `--fps --exit-at --beats --bpm`）。**`--values` 是主模型**：逗号分隔，按滚动顺序列出，**末项就是主题词**。\n   - `--from/--to/--unit` 只是数字序列的便利写法（`--from 2 --to 10 --unit 倍` = `--values 2倍,…,10倍`），不是主模型。\n   - 数字例：`--prefix 如果你的反应快 --values 2倍,3倍,4倍,5倍,6倍,7倍,8倍,9倍,10倍 --contrast 1倍`，锁定 10倍。\n   - 词例：`--prefix 如果你能 --values 加速,倒流,跳过,复制,暂停 --suffix 时间 --contrast 加速`，锁定 暂停。\n   - 再如：`--prefix 我们 --values 偶尔,经常,总是,永远 --contrast 偶尔`（锁定 永远）；`--prefix 这一次 --values 赢,输 --contrast 赢`（短词表同样成立：滚动时长不变，仍 ≥1 s，只是每格停得更久；这两个例子尚未渲过样片）。\n3. **反差词默认规则**（都可用 `--contrast` 覆盖）：\n   - 主题词是「数字+单位」（正则 `^\\d+`）：默认「1+单位」；主题本身是 1+单位时用「10+单位」。（10倍→1倍；1倍→10倍；100%→1%）\n   - 主题词是词：默认取词表里**第一个与主题词不同的词**（暂停→加速）。\n   - 选反差词的原则：和主题词意思相反或差距最大、一眼能读懂「不是它」；字数尽量和主题词相同。\n4. **反差词的位置**：接在词表**末尾**作为第 N+1 行（不替换原表），所以它可能在正滚途中已出现过一次（词例里的「加速」），这是允许的。\n5. **踏拍打字**、**光标变形成选中带**、**黄锁定冲击**、**签名擦出**、**压扁退场 + 下划线**：每部片都一样，是厂牌认得出来的那几下。\n6. 新皮肤：复制一个皮肤对象，只改字体、配色和材质绘制函数；不碰任何时间、位移、缩放、透明度曲线（像素皮肤的 1/24 量化是材质处理，不改时刻）。\n\n## 9. Pitfalls of the medium\n- 滚动太快或太短（一帧跳一个、0.45 s 滚完）观众看不出是滚出来的 → 可见滚动 ≥1 s，邻行 d=1 保留 45% 透明度、90% 大小。\n- 渐显出字会出现半个字 → 不透明度恒 1，只用缩放/下坠入场。\n- 新字放大时盖住前一个字 → 新字先画、旧字后画。\n- 反差停顿期如果变黄、闪白或响 impact，就成了「锁定两次」→ 停顿期严禁任何锁定元素。\n- 旋回做成跳切或淡入 → 必须是滚筒反向运动，有中间位、有模糊、有邻行。\n- 运动模糊判据用 ±½ 帧差分，会让停顿最后一帧误开模糊出重影 → 用快门内实际位移判断。\n- 运动模糊用普通叠加会让静止字变暗 37%；卡通描边直接加法会变灰紫 → 每个采样独立画到临时层再加法平均。\n- 锁定放大以字中心为锚会压到前半句 → 左缘锚。\n- 9:16 第二行按字高排会让框压住第一行 → 按框高排。\n- 24 fps 下固定字距会两字同帧 → 一帧最多一字，细分不够就换更密细分或报错。\n- 限幅器前瞻会把整条混音推后 5 ms → 补偿。\n- 字更宽的字体会被 0.88W 限宽自动缩字号，坐标跟着变（时间不变）。\n- 词表里词长差距太大时，滚动中框会显得空、选中带两侧不平衡 → 尽量同字数。\n\n## 10. Engine\n- demo/：`opener.html`（页面 + 字体）、`opener.js`（引擎，全部不变量在常量 `C` 里；`init(P)` 排时间线与版式，`frame(i)` 出第 i 帧，`describe(i)` 出逐帧描述）、`skins.js`（四个皮肤）、`render.py`（一条命令出片，库内精简版**不接 BGM**）、`sfx.py`（音效合成）、`build.sh`（一键渲数字例 + 词例并拼成 test.mp4）、`FONTS.md`。\n- 依赖：Python 3 + numpy + playwright（Chrome/Chromium）、ffmpeg；字体文件在本地库的 demo/fonts/（公开站不发字体文件，按 FONTS.md 来源下载）。\n- 输出：mp4 + 同名 `.timeline.json`（全部时间点、版式坐标、每帧描述、声音事件）+ `.sfx.wav`。1080p 5 秒约 20 秒渲完。\n- 自审项（源工作目录的 verify.py）：出字帧 = 设计帧、整字弹出、无半字、滚动 ≥1 s、闪白只在 D、锁定前无黄、反差可读停顿 ≥6 帧且清晰整字、旋回连续、D/D+1/D+3 中心 = 主题词、主题词先经过选中带、锁定声画 ≤5 ms、新字不挡前字、框宽装得下最宽词、整句居中、9:16 第一行不压框。本库两条样片（数字例、词例）均全过。\n\n## 11. Variation space / known gaps\n**可以变**：前半句、词表与主题词（数字或词）、反差词、后缀、副标题、D（音乐落点）、退场时刻、帧率（24/30/60，按秒取样）、画幅（16:9 / 9:16）、皮肤（四个现成，可新增）。\n**不能变**：阶段顺序、反差不锁定、旋回是滚动、锁定只在 D、锁定黄系、整字原则、版式网格、签名样式与位置、退场方式。\n\n**已知缺口（如实）**\n- 动效闸门自评 **65.8 分，未到 90**：镜头基本不动、缺少铺垫拍、次层同帧起步、无四层声画分层验证、kickoff 补写。**这不是已过闸的成片系统**，是用户认可方向的厂牌动作规范。\n- 盲看测试（不知情观众能否读出题目、看出主题词是滚出来的）未做。\n- 公开样片无 BGM；内审样片用的 We Never 没有授权证明，**任何带该歌的版本都不能对外发行**，也未入库。\n- 反差词接在词表末尾，停顿时框下半是空的，上方能看见主题词在等着（用户已看过，暂时保留）。\n- 像素皮肤反差停顿严格判定刚满 6 帧（像素字关平滑，0.4 px 偏移会落成 1 px 跳格）；其余皮肤 7 帧，9:16 为 8 帧。\n- 9:16 第一行墨迹底（含 data 辉光）距滚轮框顶只有约 1.6 px，不压但很紧。\n- 打字末字到光标变形只隔约 2 帧，放大看无互挡。\n- 皮肤亮度：cartoon/data v2 「更明显」主要靠描边与颜色，不是更亮；如需更亮再往白推。\n", "CHANGES.md": "# Changes — Brand Title Opener 厂牌滚轮片头（基础：自家 v7 片头滚轮，无官方风格基础）\n\n| 章节 | 基础（v7 片头滚轮） | 现值（v3，本条目） | 原因 |\n|---|---|---|---|\n| 1 Essence | 只为《如果你的反应快10倍》一部片做的标题 | 通用厂牌片头动作；**主题词是参数，数字和词同等** | 用户 2026-11-10「如果以后需要最后滚动的关键词不是数字……都记下来」 |\n| 1 / 8 主动作 | 滚到 10倍 停住 | 滚过主题词 → 反差词停稳 → 旋回主题词 → D 锁定 | 用户 2026-11-10「10倍这里做一个反差选择，最后旋转回我们的主题词」 |\n| 5 过冲 | v1/v2：Re 过冲 +18% 行距回弹到 D | **作废**，由 0.19 s 反差停顿 + 0.16 s 旋回取代 | v3 |\n| 5 出字 | 整字直接出现，固定间隔 | 踏拍出字（拍点表或 112.7 BPM 从 D 倒推），弹出 1.28 → 沉降，热色常驻 22% | v2 用户：「前面的字明显一点，能和音乐节拍合拍」 |\n| 5 光标 | 无 | 踏拍闪烁的光标，打字后变形成选中带 | v1 新增：把打字和滚轮连成一个动作 |\n| 5 锁定 | 一帧变黄 + 框消失 | 闪白/屏震/色差/变黄/放大/外扩环/粒子/光晕 + 框体分层退场 | v1 新增：厂牌需要认得出来的锁定动作 |\n| 3 Colour | 黄只给关键数字 | 锁定色恒为黄系（色相 40–52°），是厂牌色；反差词不许黄 | v1/v3 |\n| 4 Type | Fusion Pixel 一种 | 四皮肤四种 OFL 字体（v2 换 data=得意黑、cinema=思源宋体 Black） | v2 用户：「字体需要更吸睛」 |\n| 4 签名 | 无 | 小写 newbeer.lee，点为 accent，锁定后擦出 | v1 提案，随 v3 一起入库 |\n| 7 Sound | 歌 + 无专门音效 | 全部代码合成；新增反差落定 nope tick、旋回 whoosh；限幅器延迟补偿 | v3 |\n| 10 Engine | 片内 Three.js 场景的一部分 | 独立 Canvas 2D 引擎，纯函数逐帧，一条命令出片 | v1 |\n| 11 已知缺口 | — | 动效闸门 65.8（<90）、盲看未做、公开版无 BGM | 如实记录 |\n", "DEMO.md": "# Demo — Brand Title Opener 厂牌滚轮片头\n\n只是例子；换片子时换前半句、词表、主题词、反差词、D 和皮肤，动作和时间规则不变（见 STYLE.md）。\n\n- **test.mp4**（960×540，30 fps，10.2 s，**无 BGM，仅合成音效**；公开站再剥掉音轨）= 两条拼接：\n  1. 数字例（0–5.1 s，pixel 皮肤）：如果你的反应快 2倍→…→**10倍**（经过不停）→ 反差 **1倍** 停稳 → 旋回 → 锁定 **10倍**。\n  2. 词例（5.1–10.2 s，data 皮肤）：如果你能 加速→倒流→跳过→复制→**暂停**（经过不停）→ 反差 **加速** 停稳 → 旋回 → 锁定 **暂停** + 后缀「时间」。\n  两条都没有拍点表，按 112.7 BPM 从 D=3.30 s 倒推出字；锁定都在 f99。\n- **test.jpg**：四宫格，左列 = 反差停顿（1倍 / 加速），右列 = 锁定定格（10倍 / 暂停时间），上行数字例、下行词例。\n- **styleframe.jpg**：词例锁定后定格（如果你能**暂停**时间，主题词已变黄）。\n\n## 一键重渲（本地库 demo/）\n```bash\ncd demo && bash build.sh /tmp/brand_opener_out     # 默认不接 BGM\n```\n单条：\n```bash\n# 数字例\npython3 render.py --prefix 如果你的反应快 --values 2倍,3倍,4倍,5倍,6倍,7倍,8倍,9倍,10倍 --contrast 1倍 --drop 3.3 --skin pixel --aspect 16:9 --out num.mp4\n# 词例\npython3 render.py --prefix 如果你能 --values 加速,倒流,跳过,复制,暂停 --contrast 加速 --suffix 时间 --drop 3.3 --skin data --aspect 16:9 --out word.mp4\n# 数字便利写法（与上面数字例等价）：--from 2 --to 10 --unit 倍\n# 有歌的拍点表时：--beats beats.json --beats-drop <歌里 drop 秒数>\n```\n- 公开站只有 demo/ 下的 .js/.html/.sh/.md/.json；render.py、sfx.py 与字体文件只在本地库。字体来源见 demo/FONTS.md（全部 OFL）。\n- 两条样片在源工作目录的自审（23 项）全部通过。\n- 内审用过的样片（配 We Never）没有授权证明，不在本库、不对外。\n"}, "demo_files": ["FONTS.md", "README.md", "build.sh", "fonts", "opener.html", "opener.js", "render.py", "sfx.py", "skins.js"]}, {"slug": "cartoon-facts", "en": "Cartoon Fun Facts", "cn": "卡通冷知识", "based_on": "none (technique base: canvas 2D cutout puppets over illustrated backgrounds)", "borrows": [], "size": "1080x1920", "test_size": "540x960", "fps": 30, "library_version": "n/a (own style)", "created": "2026-11-03", "status": "draft", "skill": "卡通冷知识短片 (skill-1793643373152)", "kit": "/workspace/shared/cartoon-facts-kit/", "line": "Flat 2D cartoon with thick brown outlines: cutout characters bounce across illustrated scenes, a cut every 1.5–3 s, white pill captions with one yellow keyword.", "line_cn": "扁平 2D 卡通厚描边，抠图角色在插画背景上蹦跳移动，1.5–3 秒一切镜，白药丸字幕配黄色关键词，星芒红圈弧形箭头。", "source": "口嗨导演《章鱼冷知识》短片（0–15 s 开头经用户通过）；结构参考 https://x.com/finnardley/status/2117033492332552696 的提示词 — style learning only", "license": "Font ZCOOL KuaiLe 站酷快乐体, SIL OFL 1.1 (FONT_OFL.txt in kit)", "dir": "cartoon-facts", "poster": "cartoon-facts/test.jpg", "video": "cartoon-facts/test.mp4", "styleframe": "cartoon-facts/styleframe.jpg", "md": {"STYLE.md": "# Cartoon Fun Facts 卡通冷知识 — Style Prompt\nStatus: draft (not yet approved by the user). Skill: 卡通冷知识短片 (skill-1793643373152). Kit: /workspace/shared/cartoon-facts-kit/\n\n## 1. Essence, and what it is not\nVertical 1080×1920 flat 2D cartoon fun-fact short (30–35 s). One fact per line, one funny metaphor each; hook question shown on screen at once; the ending flips the hook into a gag. Not realistic, not slow push-ins on stills, no characters baked into backgrounds.\n## 2. Materials & rendering\nThick dark-brown outlines, flat fills + simple cel shading, big eyes, vector feel. Characters are cutouts (9 poses: neutral, shout, shock, blush, heart-eyes, sweat, attack, wilted, sidekick) moving over 9 illustrated empty backgrounds (base scale 1.2). Floating motes, vignette.\n## 3. Colour logic\nHero has its own palette clearly separated from background props. Keyword yellow #ffd21f with ink stroke; red marker for circles/arrows. No gradient text.\n## 4. Type & subtitles\nZCOOL KuaiLe 站酷快乐体 (OFL). White pill caption bar at y=1470, 60–64 px, 2–4 characters per block, one yellow keyword per block. Big title at y=430, spring-in then wobble, no full stop. No emoji.\n## 5. Motion quality\nNothing still for 1 s; a new action every 0.5–1 s inside a shot. Idle float, squash on pose change, speed lines on entry, starburst hit + shake, zoom punch 1.1. Every cut, pose, title and SFX is cued on real word timings (iron rule: element moves when the keyword is spoken).\n## 6. Camera grammar\nHard cut every 1.5–3 s; each fact gets a new background and a new pose.\n## 7. Sound palette\nFish Audio drama-3 科普男声, ~4.2–4.5 字/s; BGM ≈ −12 dB with sidechain, ~9 dB under voice; synthesized SFX (sfx_mix.py); total −14 LUFS.\n## 8. Native moves\nRed marker circle, curved red arrow, yellow/white starburst, 28-slice swim wobble, props in character local space.\n## 9. Pitfalls of the medium\nGrid-line slicing cuts neighbour limbs; white fringes; black edge at bottom when scaled; starburst too small turns to black ball; yuvj420p output; hero too small (+20%). No clipping/穿模.\n## 10. Engine\nSingle HTML canvas, frame = pure function of t, window.seek/READY/END/EV; Playwright + system Chrome, 30 fps × 6 motion-blur subframes → ffmpeg. Final renders on the Mac mini.\n## 11. Variation space / known gaps\nBackgrounds generated at low resolution look soft; English version uses Luckiest Guy. Only the 0–15 s opening has been made so far.\n\n## Rules for making a film in this style (user rules)\n1. BGM teardown HTML review page first; wait for the human's explicit「通过」.\n2. Script + shot plan to the user first; no image gen / voice / spending before confirmation.\n3. Make only the 0–15 s opening first; self-review ≥ 90/100 before showing.\n4. No clipping (不穿模).\n5. Deliver only one 1080p release (H.264 CRF 18–20, yuv420p tv range, AAC) + one preview < 10 MB. Covers 4:3 and 3:4 only.\n6. All rendering on the Mac mini. Facts need two independent sources.\n", "CHANGES.md": "# Changes — Cartoon Fun Facts 卡通冷知识 (from a blank page)\n\n| Section | Base | Now | Why |\n|---|---|---|---|\n| 1 Essence | — | flat 2D cartoon fun-fact vertical short | 口嗨导演 octopus film, opening approved by user |\n| 4 Type | — | ZCOOL KuaiLe, white pill y=1470, yellow #ffd21f keyword | Chinese glyphs; OFL |\n| 5 Motion | — | ≥1 action / 0.5–1 s, word-cued | user iron rule |\n| 6 Camera | — | cut every 1.5–3 s | source prompt |\n| 10 Engine | — | canvas + Playwright, final on Mac mini | user rule |\n", "DEMO.md": "# Demo — Cartoon Fun Facts 卡通冷知识\n\nOne example among many. Don't reuse its story, shots or timings.\n\n- Story: 0–15 s opening of 口嗨导演's《章鱼冷知识》.\n- test.mp4: 540×960, 15.8 s, **muted** (audio removed for public test), from kit `opening_15s_preview.mp4`.\n- demo/: film.html, render.py, cutout.py, splitbg.py, sfx_mix.py, words.js (source only). Font, 9 cutouts, 9 backgrounds, BGM review and self-review stay in /workspace/shared/cartoon-facts-kit/example-octopus/ (not copied).\n"}, "demo_files": ["build.sh", "cutout.py", "film.html", "render.py", "sfx_mix.py", "splitbg.py", "words.js"]}, {"slug": "film-direct-engrave", "en": "Direct-Etched Film", "cn": "胶片直刻", "based_on": "none (technique base: hand-drawn canvas 2D + post compositing)", "borrows": [], "size": "1920x1080", "test_size": "960x540", "fps": 24, "library_version": "n/a (own style, not derived from a library style)", "created": "2026-11-01", "status": "approved", "line": "Warm white lines scratched into dark film, each subject dyed one glowing colour, redrawn on twos so the whole frame breathes.", "line_cn": "像直接在黑胶片上刻出的暖白线条，每个主角只染一种发光颜色，一拍二重画，整幅画面都在轻轻颤动。", "source": "Style study of Lemomo THE NIGHT CLIMB (https://x.com/lemomo_ai/status/2116717173934825841) — style learning only", "approved_by": "owner, 2026-11-01", "dir": "film-direct-engrave", "poster": "film-direct-engrave/test.jpg", "video": "film-direct-engrave/test.mp4", "styleframe": "film-direct-engrave/styleframe.jpg", "md": {"STYLE.md": "# Direct-Etched Film 胶片直刻 — Style Prompt\n\n> Lines scratched straight into dark film stock, dyed by hand, glowing on projection.\n> Source: style study of Lemomo *THE NIGHT CLIMB* (https://x.com/lemomo_ai/status/2116717173934825841) — style learning only; never reuse its footage, frames, characters or story.\n\n## 1. Essence, and what it is not\nA dark, warm-black film frame where every drawing is an **engraved warm-white line**, and each subject carries **one saturated dye** laid in hatching that glows. Everything is redrawn **on twos**, so lines, dye and scratches boil together: it feels hand-made and projected.\n\nNot: a neon/cyberpunk glow look (no clean vector lines, no gradients), not a \"vintage film\" filter over footage (no sprocket holes, no frame borders, no sepia), not flat motion graphics, not chalkboard (lines are thin and luminous, ground is warm black, not green/grey).\n\n## 2. Materials & rendering\n- Ground: warm black `#130f10`; mean frame luma ≈ 29/255, lit area only 1–17 % of the frame.\n- Line: warm white `#f5efe2`, median width ≈ 2 px @1080 (detail), outlines 4–10 px; line ends left open, pressure varies.\n- Dye: per subject, −60° parallel hatching over a translucent base of the same colour that **spills past the outline**.\n- Overlaps brighten (additive / screen), never darken.\n- Glow: 6–10 px blur bloom on lines and dye.\n- Film damage: many short curved white hair scratches + dust specks, **20–40 per redraw, re-scattered every redraw**.\n- Vignette + a warm light leak. No sprocket holes, no frame border.\n\n## 3. Colour logic\n- Constants: warm black ground, warm white line.\n- **One subject = one dye**: cyan `#3be6d6`, blue `#3585e2`, red `#df3e30`, gold `#e7bc27`. Never two dyes on one subject; never a large dye area that out-weighs the lead (keep secondary fills small).\n- The accent the story follows gets the most saturated dye; dim non-leads to 40–60 %.\n\n## 4. Type & subtitles\n- Subtitles: warm white, light weight, small glow, bottom centre, never over the lead.\n- On-screen words are etched like lines (stroke reveal), not pasted type. Size floors from the director rules (main ≥120 px, sub ≥56, label ≥34 @1080).\n\n## 5. Motion quality\n- Boil **on twos**: random seed = floor(frame/2). Lemomo measured at 15 redraws/s; our 24 fps test is 12/s (15/s needs 30 fps — decide per film).\n- Motion slow and sparse; one lead at a time, ≤3 moving regions.\n- **Keyword hit rule**: the element tied to a spoken keyword moves on that word (±1 frame) with a clearly visible change. Never let the boil hide a weak hit (e.g. test's 「他」 Δ+2 is too weak).\n\n## 6. Camera grammar\n- Mostly locked or slow push; hard cuts between ideas; left/right split screen for comparison (you vs him).\n\n## 7. Sound palette\n- Loudness −14 LUFS integrated, true peak ≤ −1.5 dBTP. Reference ran ≈129 BPM; motion does not need to sit on beats (reference r = −0.07), but keyword hits must sit on speech.\n- No whispering, no sudden silence (user rule).\n\n## 8. Native moves\n- Hard cut (reference cuts at 14.30 / 23.37 / 30.97 s).\n- Left/right split screen for comparisons (reference 15–31 s).\n- A line etching itself in, then being dyed with hatching.\n\n## 9. Pitfalls of the medium\n- Too much dye area (the test's quilt) steals the lead.\n- Hatching too sparse loses the scratched feel; keep it dense, with dark gaps.\n- Thin lines vanish at small sizes (mosquitoes): thicken small subjects' outlines.\n- Even, uniform glow looks digital; vary it.\n- Unseeded randomness breaks parallel rendering.\n\n## 10. Engine\n- Canvas 2D hand-drawn per frame + post compositing (glow, scratches, vignette, leak) in the same page; every frame a pure function of t; seeded randomness.\n- Render: on the cloud box ≤2 workers (software WebGL, 8 cores); **official renders on the Mac mini** (user rule 2026-11-01).\n- H.264 yuv420p bt709 tv, faststart.\n\n## 11. Variation space / known gaps for next version\n- Characters: move from round-head stick figures to designed characters with expressions.\n- Denser hatching with black gaps; smaller dye areas; varied glow.\n- Boil 15/s (30 fps) vs 12/s (24 fps) to decide.\n- Add graphic language (rulers, ticks, diagrams) of our own.\n", "CHANGES.md": "# Changes — Direct-Etched Film 胶片直刻 (from a blank page)\n\n| Section | Base | Now | Why |\n|---|---|---|---|\n| 1 Essence | — | engraved warm-white lines on warm black, one dye per subject, boil on twos | user approved the 10 s test (2026-11-01) |\n| 2 Ground | — | `#130f10`, luma ≈29, lit 1–17 % | measured in style teardown |\n| 2 Line | — | `#f5efe2`, ≈2 px median @1080, outline 4–10 px, open ends | measured |\n| 2 Dye | — | −60° hatching + translucent same-colour base spilling past outline; overlaps brighten | measured |\n| 2 Glow / damage | — | 6–10 px bloom; 20–40 hair scratches + dust re-scattered each redraw; vignette + warm leak; no sprockets/border | measured |\n| 3 Palette | — | cyan #3be6d6 / blue #3585e2 / red #df3e30 / gold #e7bc27 | measured |\n| 5 Boil | — | seed=floor(frame/2); 12/s at 24 fps (reference 15/s) | test used 24 fps |\n| 5 Keyword hits | — | element moves on the spoken keyword, visibly | user iron rule |\n| 6/8 Camera | — | hard cuts, left/right split | reference grammar |\n| 7 Sound | — | −14 LUFS, TP ≤ −1.5 dBTP | house standard |\n| 10 Engine | — | canvas 2D + post; box ≤2 workers, final on Mac mini | box stability; user rule |\n", "DEMO.md": "# Demo — Direct-Etched Film 胶片直刻\n\nOne example among many. Don't reuse its story, arc, shots, props or timings.\n\n- Story: first 10 s of our film 《为什么蚊子总是咬你不咬他？》 v9 (narration + subtitles from v9).\n- Output: test.mp4, 960×540, 24 fps, 10.000 s, H.264+AAC, −14.1 LUFS, peak −1.9 dBTP. Smoke render on box, 2 workers, 44 s.\n- Files (demo/): `index.html` draws every frame (`render(t)`, seeded boil, lines, dye, scratches, post); `render.mjs` captures frames with headless Chrome; `render_mac.sh` concat + 2-pass loudnorm + mux; `build.sh` one command on the Mac mini; `audio_10s.wav` narration; `subs_10s.srt`; `verify_kw.mjs` checks keyword hits (region mean luma 0.25 s before vs 0.4 s after).\n\n## Keyword hits (verify_kw.mjs)\n| Word | t (s) | Element | Δ luma |\n|---|---|---|---|\n| 屋 | 0.69 | window frame etched | +19 |\n| 晚上 | 1.59 | moon | +18 |\n| 蚊子 | 1.99 | mosquito enters | — |\n| 你 | 2.49 | head selected | +6 |\n| 他 | 2.97 | head pulses | +2 (weak) |\n| 睡 | 3.97 | Zzz | — |\n| 天亮 | 4.17 | sun rises | — |\n| 腿 | 4.59 | leg | +24 |\n| 包 | 5.19 | red bump swells | — |\n| 痒 | 5.37 | scratch marks | — |\n| 爬起来 | 5.97 | sits up, eyes open | +17 |\n| 开灯 | 6.41 | light cone | +26 |\n| 错觉 | 7.95 | red cross over \"?\" | — |\n| 总有人 | 8.25 | him dimmed, you glow | — |\n| 招蚊子 | 9.03 | four mosquitoes circle | — |\n| 你妈 | 9.81 | speech bubble | — |\n\n## Known gaps\nRound-head stick figures; quilt dye area too big; hatching too sparse; glow too uniform; mosquito lines thin; 「他」 hit weak; boil 12/s not 15/s; kickoff/shots/checklist were not fully written for this test, so no self-score.\n"}, "demo_files": ["CREDITS", "audio_10s.wav", "build.sh", "index.html", "render.mjs", "render_mac.sh", "subs_10s.srt", "verify_kw.mjs"]}, {"slug": "light-dot-particles", "en": "Breathing Light Particles", "cn": "光点粒子", "based_on": "none (technique base: canvas 2D additive sprite particles + blur glow)", "borrows": [], "size": "1920x1080", "test_size": "960x540", "fps": 24, "library_version": "n/a (own style, not derived from a library style)", "created": "2026-11-01", "status": "draft", "line": "Everything on a near-black night is made of soft breathing light dots; scenes change by dots scattering and regathering into the next thing.", "line_cn": "近黑的夜里，人物、房子、月亮全由会呼吸的柔和光点组成；换场靠光点散开、再聚成下一样东西。", "source": "Style study of Lemomo 光点粒子 (https://x.com/lemomo_ai/status/2116748566479921576) — style learning only, no original footage kept", "dir": "light-dot-particles", "poster": "light-dot-particles/test.jpg", "video": "light-dot-particles/test.mp4", "styleframe": "light-dot-particles/styleframe.jpg", "md": {"STYLE.md": "# 光点粒子 Breathing Light Particles — STYLE (invariants only)\nLearned from Lemomo's 光点粒子 post (style study only). Measurements: /workspace/mosquito-film/styletest2/dots/REPORT.md.\n\n## 1. Essence\nNight picture-book. Every subject (people, animals, land, moon, grass) is a cloud of soft glowing dots on near-black. Dots breathe; subjects form by gathering and leave by scattering. Best for lyrical / character stories, nature, night, crowds, migration. **Not**: steps, numbers, dense facts, product UI.\n## 2. Materials & rendering\nAdditive point sprites (bright white core → coloured halo → transparent), `lighter` blending so overlaps brighten. Core radius median 3.5 px @1080 (p25 3.0, p90 5.0); a few big \"firefly\" dots 1.5×. Extra glow pass: ¼-res blur ≈ 6–10 px @1080 added at 0.5. Faint coloured haze behind dense areas. Vignette.\n## 3. Colour\nGround near-black with a cool-green cast, rgb ≈ (4–11, 5–13, 8–12), mean frame luma 12–38/255, pixels >90 only 0.3–12 %. Two-family palette: warm gold/cream for characters, moon, light (#f0dba0 / #e5e3d2 / #c2b28e); muted sage-olive for land, grass, animals, haze (#a7b47f / #9da17e / #777a5a). One accent only when the story needs it (our addition: red #ff6a4a). No saturated rainbow.\n## 4. Type\nSmall bilingual subtitle at bottom centre, cream, no box; titles may be formed of dots at the end. In our films: subtitle ≥56 px @1080, typed 35 ms/char.\n## 5. Motion\nEvery dot: per-dot twinkle ≈1.2 Hz random phase (luma ±2–3 %) + slow global breath ≈0.4 Hz (size ±12 %). Forming: dots fly in on bowed arcs with per-dot delay (0–0.35 s), ease-out. Leaving: dots scatter outward & upward, dim, ease-in. Shape morph = same dots re-targeted (never fade-swap). Outline sampling dense (~30 dots / 100×100 px @1080 on figures) vs ambient (2–5 / 100×100).\n## 6. Camera\nMostly locked or very slow push/drift; no hard cuts in the reference (0 detected cuts in 50.6 s) — transitions are particle dispersal / regathering and fades to near-black.\n## 7. Sound\nSoft music, ~−14 LUFS, motion only loosely follows loudness (r ≈ 0.29). In our films: narration + BGM, keyword → element moves on the word.\n## 8. Native moves\nScatter-and-regather transition; firefly stream / comet tail of dots; whole figure breathing; dots shiver = itch/anxiety; dots condense = attention.\n## 9. Layout\nBig negative space; horizon low (bottom 20–30 % land/grass); subject on thirds.\n## 10. Engine\ncanvas 2D, pure function of t, seeded mulberry32; renders via headless Chrome + ffmpeg on the Mac mini (`demo/render_mac.sh`).\n## 11. Don'ts\nNo line strokes (only dots); no hard cuts; no flat fills; don't copy the reference's girl/deer/moon composition.\n", "CHANGES.md": "| Section | Base (Lemomo reference, measured) | Now (ours) | Why |\n|---|---|---|---|\n| §3 colour | gold + sage only | + one red accent for story beats | keyword must be visible (mosquito bites) |\n| §4 type | tiny subtitles | ≥56 px @1080, typed 35 ms/char | our type floor and subtitle rule |\n| §5 motion | movement loosely tied to music | keyword → element moves on the word | user iron rule |\n| §6 camera | mostly locked | slow push 1.00→1.07 + drift | our camera-variable rule |\n| §2 rendering | dense haze/grass field, ~3000 dots | demo uses ~2,300 dots + 230 dust | first draft; density to be raised |\n", "DEMO.md": "# DEMO — 光点粒子 test (8 s, 960×540, 24 fps)\nOne example among many. Don't reuse its story, arc, shots, props or timings.\n\nStory: opening of our mosquito film — \"为什么同一间屋、同一个晚上，蚊子只咬你，不咬他？他一觉睡到天亮，你腿上全是包，痒得你半夜爬起来开灯找蚊子。\"\nShots (single continuous shot): dust → dots gather into a house (屋 1.03) → moon gathers in the window (晚上 1.59) → white mosquito swarm flies in (蚊子 1.99) → dives to you, you pulse (你 2.49) → hovers at him, he pulses, it turns back (他 2.97) → Z's float (睡 3.97) → moon sinks (天亮 4.17) → red dots swell on your leg (包 5.19) → your dots shiver (痒 5.37) → your dots re-gather sitting up (爬起来 5.97) → lamp cone of dots (开灯 6.27) → mosquito scatters (找蚊子 6.55) → everything disperses (7.2–8.0).\nPalette: BG #050608, GOLD #f0dba0, SAGE #a7b47f, RED #ff6a4a, COOL #e2ece8. Score: our v9 narration+BGM, −14 LUFS.\nFiles: demo/index.html draws everything (samplers poly/circ/rectFill, keyframes per particle, render(t)); render.mjs frame capture; render_mac.sh mux + loudnorm; build.sh one command.\n"}, "demo_files": ["CREDITS", "audio_8s.wav", "build.sh", "index.html", "render.mjs", "render_mac.sh", "still.mjs"]}, {"slug": "paper-checklist-explainer", "en": "Paper Checklist Explainer", "cn": "清单讲解", "based_on": "none (code-only canvas animation, paper red-and-black)", "borrows": [], "size": "1080x1920", "test_size": "540x960", "fps": 30, "library_version": "n/a (own style)", "created": "2026-11-03", "status": "approved", "approved": "2026-11-03", "replaces": "redline-stickman (archived outside the public site)", "line": "Off-white paper, ink outlines with offset hard shadows and one red accent; UI checklist cards break a concept into steps while an original presenter explains from the bottom-right.", "line_cn": "米白纸感底+墨黑描边错位硬投影+唯一正红，UI清单卡片把概念拆步讲清，右下原创主播讲解，逐字触发动作。", "source": "Own finished films (rag-intro, cmg-taishan, mcp-meituan-luckin, sample_e), made with a privately licensed engine installed for the owner only — engine and its source are not shared", "license": "Fonts: Smiley Sans 得意黑 (https://github.com/atelier-anchor/smiley-sans, SIL OFL 1.1); LXGW WenKai 霞鹜文楷 (https://github.com/lxgw/LxgwWenKai, SIL OFL 1.1). Download from the official repos.", "audio": "public test.mp4 and all previews are muted", "dir": "paper-checklist-explainer", "poster": "paper-checklist-explainer/test.jpg", "video": "paper-checklist-explainer/test.mp4", "styleframe": "paper-checklist-explainer/styleframe.jpg", "md": {"STYLE.md": "# Paper Checklist Explainer 清单讲解 — Style Prompt\nStatus: approved by the owner 2026-11-03. Replaces 红线火柴人.\nLicense boundary: this look is produced with an engine licensed to the owner only. The engine, its source code and its original docs are never shared or published; this entry holds only our own summary, muted previews and keyframes. To make a film in this style you still need the owner's locally installed engine.\n\n## 1. Essence, and what it is not\nA vertical explainer that breaks one concept into steps with UI-checklist parts (rounded cards, pill tags, tick lists, bubbles, arrow routes, phone/interface frames) on warm paper, with an original presenter talking from the bottom-right. Not stock motion-graphics templates, not live footage, no logos.\n## 2. Materials & rendering\nOff-white paper ground with light grain; far layer of pale-grey ridges or mist drifting slowly so the frame is never fully still. Thick ink outlines with offset hard shadows: a paper-cut card feel. Content scaled into the upper-left area to leave the presenter corner free.\n## 3. Colour logic\nInk black for outlines and main text; one red for emphasis (keywords, seals, primary buttons, routes); neutral grey only as support. No other hues.\n## 4. Type & subtitles\nFonts: Smiley Sans 得意黑 (headlines/captions) and LXGW WenKai 霞鹜文楷 (secondary), both OFL. Captions at the top (~y 330), revealed per character, the spoken character highlighted, keywords red or bold-enlarged. Emphasis devices: tilted red-box \"seal\", red pill tag, numbered badges 1/2/3. Opinion passages carry a clear red「观点」tag. Brands appear only as text cards.\n## 5. Motion quality\nEvery sentence gets at least one visual action (pop, slide, tick, stamp, connect, count) triggered by a specific spoken character (iron rule). Self-check gates: motion ≥ 4.8, big moments ≥ 0.65/s, calm frames ≤ 27 %, no 2 s gap without a new event. Originality gates: roughly ≥ 40 scene-code lines/s and ≥ 2.5 self-drawn props/mechanisms per second — each script invents its own metaphors.\n## 6. Camera grammar\n1080×1920, 30 fps, code-only. Safe area y 360–1420; nothing in the right 120 px; bottom-right reserved for the presenter. Light whip between sentences; constant slow push or drift.\n## 7. Sound palette\nFish Audio Drama 3 科普男声, whole script in one take, optional slight speed-up (~1.1×; sample_e kept 1.0). Local Whisper per-character alignment checked by CER against the script. Locally synthesized whoosh/pop/ding/stamp SFX on visual events, bus under the voice, near-duplicates merged. Two-pass loudnorm −14 LUFS, TP ≤ −1.5.\n## 8. Native moves\nRed stamp slam, tick-list fill, numbered badge count, arrow route drawing itself, card flip, presenter pointing at the active card.\n## 9. Pitfalls of the medium\nToo many reused stock parts fail the originality gate; content under the presenter or caption; dead 2 s stretches; hidden hits during transitions (land the hit before the cut).\n## 10. Engine\nOwner-licensed local engine (canvas rendering + headless capture + ffmpeg); not shared. Final renders on the Mac mini; one render at a time. Release: H.264 High 4.1 yuv420p tv range CRF 18; mobile CRF 24, ≤3 Mbps, AAC 128k, faststart. Covers 3:4 and 4:3.\n## 11. Variation space / known gaps\nPresenter: engine-drawn glasses presenter, or the owner's own paper-cut character (sample_e). Pace 20–52 s. Caption lead timing vs on-the-word timing still to settle per film.\n\n## Rules for making a film (owner rules)\n1. 12–16 frame stills sheet reviewed before rendering video.\n2. Motion and originality gates must pass; at most 4 rounds; never bypass.\n3. No upload or publishing until the owner confirms. Facts need sources; no made-up numbers.\n", "CHANGES.md": "# Changes — Paper Checklist Explainer 清单讲解 (replaces 红线火柴人)\n\n| Section | Base | Now | Why |\n|---|---|---|---|\n| 1 Essence | 红线火柴人 (stick figures) | UI-checklist cards + original presenter | owner asked to replace the stickman with the purchased style (2026-11-03) |\n| 4 Type | Anton | Smiley Sans + LXGW WenKai (OFL) | Chinese glyphs, open source |\n| 5 Motion | keyword hit | + numeric motion/originality gates | summarized from own films |\n| 10 Engine | own canvas | owner-licensed local engine | not shared |\n\n| 2026-11-03 | status | draft → approved | owner approved (批准) |\n", "DEMO.md": "# Demo — Paper Checklist Explainer 清单讲解\n\nExamples only; don't reuse their stories or shots.\n- test.mp4: first 25 s of our RAG explainer, 540×960, muted.\n- Local only (examples/): muted 25 s previews of the RAG, robot-mountain and AI-ordering explainers, plus sample_e (20 s, presenter = the owner's own paper-cut character redrawn by the engine, Smiley Sans + LXGW WenKai, Fish Drama 3 voice; preview muted, 540×960); 6 keyframes each; license boundary note.\n- No engine code is included.\n"}, "demo_files": []}, {"slug": "pixel-rpg-25d-explainer", "en": "Pixel RPG 2.5D Explainer", "cn": "像素RPG 2.5D 科普", "based_on": "Lemo official style pixel-rpg (16-bit Pixel RPG) — its pixel layers placed in a Three.js 2.5D space", "borrows": ["Lemo official pixel-rpg sprite / tile / UI layers (used from a local copy; shared source untouched)", "16-bit RPG UI grammar: dialogue box, choice box with cursor, status panel"], "size": "1920x1080 (native 640x360, integer x3 nearest-neighbour)", "test_size": "960x540", "fps": 24, "library_version": "未提供", "created": "2026-11-10", "status": "approved", "approved": "2026-11-10", "approved_by": "owner, 2026-11-10 (v7 finalised and ordered into the library)", "line": "A second-person 'what if' explainer acted out by 16-bit pixel characters in a 2.5D Three.js stage: RPG dialogue and choice boxes, a slot-wheel title, and bullet-time shots with a crawling real-time clock.", "line_cn": "第二人称“如果你……”像素口播科普：16-bit 像素角色在 Three.js 2.5D 舞台里演，RPG 对话框和选择框，滚轮标题，子弹时间慢放配“现实时间”读秒。", "source": "Own finished film《如果你的反应快10倍》v7 (2026-11-10). Story adapted from Ifverse (https://www.youtube.com/watch?v=MroF1XmHOZw) — adaptation reference only; no Ifverse footage or frames are stored here.", "license": "Font: Fusion Pixel 12px (SIL OFL 1.1, https://github.com/TakWolf/fusion-pixel-font). SFX: CC0 (Freesound). Narration: Fish Audio drama-3. BGM 'We Never': licence proof NOT obtained — never published with sound.", "audio": "public test.mp4 is muted (BGM licence proof missing)", "render_source": "deleted at the owner's request on 2026-11-10; not reproducible from this library", "dir": "pixel-rpg-25d-explainer", "poster": "pixel-rpg-25d-explainer/test.jpg", "video": "pixel-rpg-25d-explainer/test.mp4", "styleframe": "pixel-rpg-25d-explainer/styleframe.jpg", "md": {"STYLE.md": "# Pixel RPG 2.5D Explainer 像素RPG 2.5D 科普 — Style Prompt\n\n> A \"what if you…\" explainer told like a 16-bit RPG: pixel characters act it out on a 2.5D stage, the game UI does the explaining.\n> Source: our own finished film《如果你的反应快10倍》v7 (2026-11-10). Story adapted from Ifverse (https://www.youtube.com/watch?v=MroF1XmHOZw), adaptation reference only. Never reuse its footage, frames or shots.\n\n## 1. Essence, and what it is not\nSecond-person hypothetical science told as a game. \"You\" are a chibi pixel hero. Every claim is **acted out as a scene**, and **RPG UI** spells out the point: status panels, dialogue boxes, choice boxes, tag panels. Slow motion is shown as \"bullet time\": the world crawls while a real-time clock barely moves.\n\nNot: a retro filter over footage. Not a flat 2D slideshow (the layers sit at different depths and the camera moves through them). Not a game trailer (there's no gameplay loop; the UI exists to explain). Not chiptune-only (the narration leads).\n\n## 2. Materials & rendering\n- Pixel layers (sprites, tiles, UI) from the Lemo official **pixel-rpg** set, placed on z-layers in a **Three.js 2.5D (WebGPU)** scene: foreground / middle ground / background parallax.\n- Native canvas **640×360**, upscaled with **integer ×3 nearest-neighbour** to 1920×1080. No smoothing, no sub-pixel text.\n- Characters: parametric chibi rig (lean, reach, crouch, expressions), with thick dark outlines.\n- Post: greyscale \"freeze\" that keeps colour only on the hero layer (used for decision moments); light grain.\n\n## 3. Colour logic\n- Palette: ENDESGA-32 (as recorded in the kickoff notes).\n- UI: dark navy panels with a cyan edge. Yellow is reserved for the key number or the chosen option (the \"10倍\", the selected choice, the bullet-time target). Amber marks warnings and results; red marks \"回放\", REC and danger.\n- In decision moments the world turns grey and the hero stays in colour.\n\n## 4. Type & subtitles\n- Font **Fusion Pixel 12px** (OFL), drawn on its native grid and upscaled by integers only.\n- Size floors @1080: title 180 px (×5), choice / key words 144 px (×4), big numbers 144 px, subtitles and panel text 72 px (×2), labels 36 px (×1).\n- **Text appears as whole characters only.** Short labels, card lines and quotes **pop in whole** (a half-typed short word reads as cut off). Long subtitles may chunk in.\n- A panel opens first (fast, about 0.1 s), then its text. Never show an empty box or a lone quote mark.\n- Subtitles: white with a dark outline, bottom centre, chunked by clause, never over the action.\n\n## 5. Motion quality\n- Every frame is a pure function of t (single clock, seeded randomness).\n- Big actions get anticipation and settle; impacts get a shake and stars.\n- Irritation and boredom are shown by **hard cuts every 0.7–1.5 s** between small hero actions (yawn, anger mark, fidget scribble), not by one long held shot.\n- Keep ≤3 moving regions and no uniform motion longer than 0.5 s (the self-check still flags about 3% of frames).\n\n## 6. Camera grammar\n- Push-ins and slow pans on camPath keys; hard cuts between ideas; close-ups for \"friend 0.25秒 / you 0.025秒\" comparisons.\n- High shot → hard cut to a low shot when a falling object must read clearly against a character (keep a visible gap; never cover a face).\n- Characters stay ≥24 px (1080p) from the frame edge. A ≤0.2 s pan entry is tolerated.\n\n## 7. Sound palette\n- Fish Audio drama-3 narration, normal volume and clear voice (**no whispering or lowered voice**).\n- CC0 Freesound SFX on every UI action: typing ticks, wheel ticks, panel pop, slam, cheer, \"叮\" for a reward.\n- The BGM's four layers (low / rhythm / melody / ambience) were analysed and drive four visual layers.\n- Mix −14 LUFS integrated, true peak ≈ −1.4 dBFS.\n\n## 8. Native moves\n- **Slot-wheel title**: \"如果你的反应快\" types in at 0.04 s per character. Then a reel window with steel rails, end caps, top/bottom fade masks and an amber selection band rolls 2倍 → 10倍 and locks in yellow with a glow. The reel furniture fades out after the lock. Full timing/visual spec: see the section below and `TITLE_ANIMATION.md`（逐字整字弹出每字0.04s+打字声 → 「快」打完后 2.05–3.08s 减速滚动 2倍→10倍、相邻行淡出、8声滚轮tick → 3.08–3.30s 过冲回弹吸附 → 3.30s 卡音乐drop锁定变黄发光，主标题≈180px、副标题≈108px）.\n- **Bullet-time beat** in three shots: setup (e.g. \"苍蝇来袭 / 朋友：啪！没打中\", MISS) → bullet time (tag panel \"子弹时间 ×0.1 + one-line rule\", top-right \"现实时间 0.05秒\" barely moving, yellow target ring + dashed path, hero reaches first) → result tag (\"获得：苍蝇 ×1\" / \"一滴没洒\") + the friend's \"？？？\".\n- **Status panel**: \"状态 / 反应速度 ×1 → ×10\" with a filling bar and stars.\n- **Choice box**: two options, a white cursor arrow, a yellow selection fill, and a countdown \"剩余0.xx秒\" **inside** the box at bottom-right.\n- **Bet / challenge segments**: speech bubbles, a score pill (\"你 1:0 朋友\"), and a pay-off (the friend hands over the milk tea).\n- **Replay screen**: a filled screen with a solid header bar (\"回放\" badge + REC dot + timecode) and \"×0.1 慢放\" in a corner.\n- Cold-open freeze on the decision, then a pixel-mosaic transition into the title.\n\n### 开头标题出现动画（滚轮标题）——设计规范\n\n来源：用户给的参考图方案（逐字打出 + iOS 式滚轮滚到「10倍」），v7 定稿实际做法。以下数值取自 v3–v7 制作记录；渲染源码已删除，只能按本文重做。\n\n#### 时间线（片内绝对时间，24fps）\n| 时间 | 发生什么 | 声音 |\n|---|---|---|\n| 0–约1.8 s | 冷开场：决定瞬间定格 + 选择框（钩子），像素马赛克转场进标题 | — |\n| 约1.0–2.0 s | 「如果你的反应快」逐字出现，每字 0.04 s；每个字**整字弹出**（不渐显、不出半个字），每字一声打字「咔」 | 打字 tick |\n| 2.05 s | 「快」字必须已经打完，滚轮才开始 | — |\n| 2.05–3.08 s | 滚轮从 2倍 往上滚到 10倍：先快后慢（减速缓动），相邻上下两行数字可见并逐渐淡出，每过一格一声「嗒」，全程约 8 声 | 滚轮 tick ×8 |\n| 3.08–3.30 s | 惯性过冲一点再回弹吸附（snap）到 10倍 | 最后一声 tick |\n| 3.30 s | 锁定：正好卡在音乐 drop 上；「10倍」变黄并发光；滚轮外框淡出 | drop |\n| 之后 | 副标题出现 | — |\n\n#### 视觉构成\n- 字体：Fusion Pixel 12px（OFL），整数倍放大，不做亚像素平滑。\n- 主标题字号约 180 px（1080p 下），白字 + 深色投影；副标题约 108 px，白色。\n- 「10倍」锁定后：黄色 + 外发光，居中偏大。\n- 滚轮外框：钢质导轨（左右 rails）+ 上下端盖 + 上下渐隐遮罩 + 琥珀色选中带；相邻行用遮罩淡出，不能缩成看不清的小字。\n- 锁定后滚轮外框淡出，只留下标题文字。\n\n#### 验收（每次必须逐帧核对）\n1. 抽 2.0–3.4 s 每帧拼图，能看到数字是**一格一格连续滚上来**，不是一帧跳一个数。\n2. 滚动时间 ≥ 1 s，有减速，有过冲回弹。\n3. 「快」字打完前滚轮不能动；任何一帧不能出现半个字或残留符号。\n4. 锁定帧落在音乐 drop 上（误差 ≤ 1 帧）。\n5. 找不知情的观看者盲看，确认能说出「10倍是滚出来的」。\n\n#### 踩过的坑\n- v2：一帧跳一个数字、0.45 s 就滚完，相邻行太小 → 观众看不出在滚动（用户退回）。\n- v4：标题下面残留小符号；字是渐显的，会出现半个字 → v5 改成整字弹出。\n\n## 9. Pitfalls of the medium\n- A half-typed short label (\"只有1\", \"只掉3\") reads as truncated: pop it whole.\n- An empty or thin panel frame reads as a glitch: gate the text on the panel being fully open.\n- A cropped prop reads as UI (a half movie car read as a \"progress bar\"): draw it only when it's whole in frame, or cut it.\n- Colour-noise strips between badges read as an empty box: use solid bars.\n- A timer pressed against a box edge: put it inside the box.\n- A falling object over a face, or characters touching the frame edge.\n- Character legs merging into a dark car body / subtitle band: stand the character on visible ground with a shadow, above the subtitle zone.\n- Code: never leave a trailing `//` comment mid-line in generated code; run `node --check` every time.\n\n## 10. Engine\n- Three.js (WebGPU) 2.5D stage with Lemo official pixel-rpg layers. The render page exposes `render(t)`; Playwright drives headless Chrome (SwiftShader WebGPU on the box), and frames are piped to **ffmpeg** (H.264 yuv420p bt709 tv, CRF18, faststart; 720p preview ~750 kbps).\n- QA: a per-frame text scanner (overlap / cut / text-over-panel / empty panel / character edge), a motion verifier with four-layer ablation renders, and loudness checks.\n- **The render source of the reference film was deleted at the owner's request (2026-11-10).** Only the cover generator survives (demo/).\n\n## 11. Variation space / known gaps\n- The motion self-check never reached 90 (71.25: static holds, breath bars, layer-timing misses). Next film: design breath bars and layer entries into the timeline from the start.\n- BGM licence: use a track with licence proof so the public version can have sound.\n- Topics: any \"what if you were 10× faster / stronger / smaller…\" hypothetical, reaction / speed / perception explainers.\n- 未提供: a vertical 9:16 version of the stage, and tested durations other than about 2 min.\n- Later brand title openers follow the separate entry `brand-title-opener` (contrast pick, then spin back to the theme word; the theme word can be a word, not only a number). This film's own v7 title history above is unchanged.\n", "CHANGES.md": "# Changes — Pixel RPG 2.5D Explainer 像素RPG 2.5D 科普 (base: Lemo official pixel-rpg)\n\n| Section | Base (official pixel-rpg) | Now | Why |\n|---|---|---|---|\n| 1 Essence | 16-bit RPG game-trailer storytelling | second-person \"what if\" explainer; UI explains, scenes act it out | Ifverse adaptation《如果你的反应快10倍》 |\n| 2 Stage | pixel layers | the same layers on z-depths in Three.js 2.5D (WebGPU), parallax, camera moves | depth + camera grammar |\n| 2 Resolution | 未提供 | native 640×360 → integer ×3 nearest to 1920×1080, 24 fps | crisp pixels, no sub-pixel text |\n| 4 Type | 未提供 | Fusion Pixel 12px (OFL), whole characters only; short labels / quotes pop whole; sizes 180/144/72/36 | v4–v7 review: half-typed words read as truncated |\n| 4 Panels | RPG boxes | panel opens 3× faster, text only when fully open; timer inside the choice box | v6/v7 review: empty frames, timer touching the edge |\n| 5 Motion | 未提供 | irritation = hard cuts every 0.7–1.5 s with small hero actions | v6 cinema review |\n| 6 Camera | 未提供 | push/pan + hard cuts; characters ≥24 px from the edge; never cover faces | v6/v7 review |\n| 7 Sound | 未提供 | Fish drama-3 narration (no whisper), CC0 SFX, four-layer BGM analysis, −14 LUFS | house standard + user rules |\n| 8 Moves | save-point flashback | slot-wheel title, bullet-time beat with a real-time clock, status panel, choice box, bet segments, replay screen | built for this film, kept as invariants |\n| 10 Engine | 未提供 | Playwright + headless Chrome WebGPU → ffmpeg; per-frame text/edge scanner | production pipeline (source since deleted) |\n", "DEMO.md": "# Demo — Pixel RPG 2.5D Explainer 像素RPG 2.5D 科普\n\nOne example only. Don't reuse its story, shots or timings.\n\n- Example film: our《如果你的反应快10倍》v7 (about 2 min, 1920×1080, 24 fps). The story is adapted from Ifverse (https://www.youtube.com/watch?v=MroF1XmHOZw), **adaptation reference only**; no Ifverse footage or frames are in this library.\n- test.mp4: the first 14 s of v7 (cold-open choice box → slot-wheel title → office bullet-time beats), 960×540, 24 fps, **muted**. The BGM \"We Never\" has no licence proof, so no public file carries sound.\n- test.jpg: the locked title \"如果你的反应快10倍\" (3.3 s). styleframe.jpg: a bullet-time shot (6.5 s).\n- **The render source (Three.js scene, film timeline, engine copy, audio mixer, QA scanners) was deleted at the owner's request on 2026-11-10. The film cannot be re-rendered from this library.** Don't pretend otherwise; rebuild new films from STYLE.md.\n- demo/ (what still exists):\n  - `make_covers_v7.py`: generates the cover family (black grain card + choice-box frame + Fusion Pixel text) in 3:4, 4:3, 16:9, 9:16 and 1:1, and asserts the safe area / overlaps for every text box.\n  - `build.sh`: runs it. Needs the Fusion Pixel TTF (OFL, download it from the official repo) and the approved cover-B image (kept in the final package, not in the library). It was tested on 2026-11-10 and reproduced all 5 covers byte for byte.\n  - `cover_check.json`: the text boxes, safe areas and minimum edge distances of the v7 covers.\n- The final package (film, covers, PUBLISH
