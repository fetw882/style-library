 % of the frame.\n- Line: warm white `#f5efe2`, median width ≈ 2 px @1080 (detail), outlines 4–10 px; line ends left open, pressure varies.\n- Dye: per subject, −60° parallel hatching over a translucent base of the same colour that **spills past the outline**.\n- Overlaps brighten (additive / screen), never darken.\n- Glow: 6–10 px blur bloom on lines and dye.\n- Film damage: many short curved white hair scratches + dust specks, **20–40 per redraw, re-scattered every redraw**.\n- Vignette + a warm light leak. No sprocket holes, no frame border.\n\n## 3. Colour logic\n- Constants: warm black ground, warm white line.\n- **One subject = one dye**: cyan `#3be6d6`, blue `#3585e2`, red `#df3e30`, gold `#e7bc27`. Never two dyes on one subject; never a large dye area that out-weighs the lead (keep secondary fills small).\n- The accent the story follows gets the most saturated dye; dim non-leads to 40–60 %.\n\n## 4. Type & subtitles\n- Subtitles: warm white, light weight, small glow, bottom centre, never over the lead.\n- On-screen words are etched like lines (stroke reveal), not pasted type. Size floors from the director rules (main ≥120 px, sub ≥56, label ≥34 @1080).\n\n## 5. Motion quality\n- Boil **on twos**: random seed = floor(frame/2). Lemomo measured at 15 redraws/s; our 24 fps test is 12/s (15/s needs 30 fps — decide per film).\n- Motion slow and sparse; one lead at a time, ≤3 moving regions.\n- **Keyword hit rule**: the element tied to a spoken keyword moves on that word (±1 frame) with a clearly visible change. Never let the boil hide a weak hit (e.g. test's 「他」 Δ+2 is too weak).\n\n## 6. Camera grammar\n- Mostly locked or slow push; hard cuts between ideas; left/right split screen for comparison (you vs him).\n\n## 7. Sound palette\n- Loudness −14 LUFS integrated, true peak ≤ −1.5 dBTP. Reference ran ≈129 BPM; motion does not need to sit on beats (reference r = −0.07), but keyword hits must sit on speech.\n- No whispering, no sudden silence (user rule).\n\n## 8. Native moves\n- Hard cut (reference cuts at 14.30 / 23.37 / 30.97 s).\n- Left/right split screen for comparisons (reference 15–31 s).\n- A line etching itself in, then being dyed with hatching.\n\n## 9. Pitfalls of the medium\n- Too much dye area (the test's quilt) steals the lead.\n- Hatching too sparse loses the scratched feel; keep it dense, with dark gaps.\n- Thin lines vanish at small sizes (mosquitoes): thicken small subjects' outlines.\n- Even, uniform glow looks digital; vary it.\n- Unseeded randomness breaks parallel rendering.\n\n## 10. Engine\n- Canvas 2D hand-drawn per frame + post compositing (glow, scratches, vignette, leak) in the same page; every frame a pure function of t; seeded randomness.\n- Render: on the cloud box ≤2 workers (software WebGL, 8 cores); **official renders on the Mac mini** (user rule 2026-11-01).\n- H.264 yuv420p bt709 tv, faststart.\n\n## 11. Variation space / known gaps for next version\n- Characters: move from round-head stick figures to designed characters with expressions.\n- Denser hatching with black gaps; smaller dye areas; varied glow.\n- Boil 15/s (30 fps) vs 12/s (24 fps) to decide.\n- Add graphic language (rulers, ticks, diagrams) of our own.\n", "CHANGES.md": "# Changes — Direct-Etched Film 胶片直刻 (from a blank page)\n\n| Section | Base | Now | Why |\n|---|---|---|---|\n| 1 Essence | — | engraved warm-white lines on warm black, one dye per subject, boil on twos | user approved the 10 s test (2026-11-01) |\n| 2 Ground | — | `#130f10`, luma ≈29, lit 1–17 % | measured in style teardown |\n| 2 Line | — | `#f5efe2`, ≈2 px median @1080, outline 4–10 px, open ends | measured |\n| 2 Dye | — | −60° hatching + translucent same-colour base spilling past outline; overlaps brighten | measured |\n| 2 Glow / damage | — | 6–10 px bloom; 20–40 hair scratches + dust re-scattered each redraw; vignette + warm leak; no sprockets/border | measured |\n| 3 Palette | — | cyan #3be6d6 / blue #3585e2 / red #df3e30 / gold #e7bc27 | measured |\n| 5 Boil | — | seed=floor(frame/2); 12/s at 24 fps (reference 15/s) | test used 24 fps |\n| 5 Keyword hits | — | element moves on the spoken keyword, visibly | user iron rule |\n| 6/8 Camera | — | hard cuts, left/right split | reference grammar |\n| 7 Sound | — | −14 LUFS, TP ≤ −1.5 dBTP | house standard |\n| 10 Engine | — | canvas 2D + post; box ≤2 workers, final on Mac mini | box stability; user rule |\n", "DEMO.md": "# Demo — Direct-Etched Film 胶片直刻\n\nOne example among many. Don't reuse its story, arc, shots, props or timings.\n\n- Story: first 10 s of our film 《为什么蚊子总是咬你不咬他？》 v9 (narration + subtitles from v9).\n- Output: test.mp4, 960×540, 24 fps, 10.000 s, H.264+AAC, −14.1 LUFS, peak −1.9 dBTP. Smoke render on box, 2 workers, 44 s.\n- Files (demo/): `index.html` draws every frame (`render(t)`, seeded boil, lines, dye, scratches, post); `render.mjs` captures frames with headless Chrome; `render_mac.sh` concat + 2-pass loudnorm + mux; `build.sh` one command on the Mac mini; `audio_10s.wav` narration; `subs_10s.srt`; `verify_kw.mjs` checks keyword hits (region mean luma 0.25 s before vs 0.4 s after).\n\n## Keyword hits (verify_kw.mjs)\n| Word | t (s) | Element | Δ luma |\n|---|---|---|---|\n| 屋 | 0.69 | window frame etched | +19 |\n| 晚上 | 1.59 | moon | +18 |\n| 蚊子 | 1.99 | mosquito enters | — |\n| 你 | 2.49 | head selected | +6 |\n| 他 | 2.97 | head pulses | +2 (weak) |\n| 睡 | 3.97 | Zzz | — |\n| 天亮 | 4.17 | sun rises | — |\n| 腿 | 4.59 | leg | +24 |\n| 包 | 5.19 | red bump swells | — |\n| 痒 | 5.37 | scratch marks | — |\n| 爬起来 | 5.97 | sits up, eyes open | +17 |\n| 开灯 | 6.41 | light cone | +26 |\n| 错觉 | 7.95 | red cross over \"?\" | — |\n| 总有人 | 8.25 | him dimmed, you glow | — |\n| 招蚊子 | 9.03 | four mosquitoes circle | — |\n| 你妈 | 9.81 | speech bubble | — |\n\n## Known gaps\nRound-head stick figures; quilt dye area too big; hatching too sparse; glow too uniform; mosquito lines thin; 「他」 hit weak; boil 12/s not 15/s; kickoff/shots/checklist were not fully written for this test, so no self-score.\n"}, "demo_files": ["CREDITS", "audio_10s.wav", "build.sh", "index.html", "render.mjs", "render_mac.sh", "subs_10s.srt", "verify_kw.mjs"]}, {"slug": "light-dot-particles", "en": "Breathing Light Particles", "cn": "光点粒子", "based_on": "none (technique base: canvas 2D additive sprite particles + blur glow)", "borrows": [], "size": "1920x1080", "test_size": "960x540", "fps": 24, "library_version": "n/a (own style, not derived from a library style)", "created": "2026-11-01", "status": "draft", "line": "Everything on a near-black night is made of soft breathing light dots; scenes change by dots scattering and regathering into the next thing.", "line_cn": "近黑的夜里，人物、房子、月亮全由会呼吸的柔和光点组成；换场靠光点散开、再聚成下一样东西。", "source": "Style study of Lemomo 光点粒子 (https://x.com/lemomo_ai/status/2116748566479921576) — style learning only, no original footage kept", "dir": "light-dot-particles", "poster": "light-dot-particles/test.jpg", "video": "light-dot-particles/test.mp4", "styleframe": "light-dot-particles/styleframe.jpg", "md": {"STYLE.md": "# 光点粒子 Breathing Light Particles — STYLE (invariants only)\nLearned from Lemomo's 光点粒子 post (style study only). Measurements: /workspace/mosquito-film/styletest2/dots/REPORT.md.\n\n## 1. Essence\nNight picture-book. Every subject (people, animals, land, moon, grass) is a cloud of soft glowing dots on near-black. Dots breathe; subjects form by gathering and leave by scattering. Best for lyrical / character stories, nature, night, crowds, migration. **Not**: steps, numbers, dense facts, product UI.\n## 2. Materials & rendering\nAdditive point sprites (bright white core → coloured halo → transparent), `lighter` blending so overlaps brighten. Core radius median 3.5 px @1080 (p25 3.0, p90 5.0); a few big \"firefly\" dots 1.5×. Extra glow pass: ¼-res blur ≈ 6–10 px @1080 added at 0.5. Faint coloured haze behind dense areas. Vignette.\n## 3. Colour\nGround near-black with a cool-green cast, rgb ≈ (4–11, 5–13, 8–12), mean frame luma 12–38/255, pixels >90 only 0.3–12 %. Two-family palette: warm gold/cream for characters, moon, light (#f0dba0 / #e5e3d2 / #c2b28e); muted sage-olive for land, grass, animals, haze (#a7b47f / #9da17e / #777a5a). One accent only when the story needs it (our addition: red #ff6a4a). No saturated rainbow.\n## 4. Type\nSmall bilingual subtitle at bottom centre, cream, no box; titles may be formed of dots at the end. In our films: subtitle ≥56 px @1080, typed 35 ms/char.\n## 5. Motion\nEvery dot: per-dot twinkle ≈1.2 Hz random phase (luma ±2–3 %) + slow global breath ≈0.4 Hz (size ±12 %). Forming: dots fly in on bowed arcs with per-dot delay (0–0.35 s), ease-out. Leaving: dots scatter outward & upward, dim, ease-in. Shape morph = same dots re-targeted (never fade-swap). Outline sampling dense (~30 dots / 100×100 px @1080 on figures) vs ambient (2–5 / 100×100).\n## 6. Camera\nMostly locked or very slow push/drift; no hard cuts in the reference (0 detected cuts in 50.6 s) — transitions are particle dispersal / regathering and fades to near-black.\n## 7. Sound\nSoft music, ~−14 LUFS, motion only loosely follows loudness (r ≈ 0.29). In our films: narration + BGM, keyword → element moves on the word.\n## 8. Native moves\nScatter-and-regather transition; firefly stream / comet tail of dots; whole figure breathing; dots shiver = itch/anxiety; dots condense = attention.\n## 9. Layout\nBig negative space; horizon low (bottom 20–30 % land/grass); subject on thirds.\n## 10. Engine\ncanvas 2D, pure function of t, seeded mulberry32; renders via headless Chrome + ffmpeg on the Mac mini (`demo/render_mac.sh`).\n## 11. Don'ts\nNo line strokes (only dots); no hard cuts; no flat fills; don't copy the reference's girl/deer/moon composition.\n", "CHANGES.md": "| Section | Base (Lemomo reference, measured) | Now (ours) | Why |\n|---|---|---|---|\n| §3 colour | gold + sage only | + one red accent for story beats | keyword must be visible (mosquito bites) |\n| §4 type | tiny subtitles | ≥56 px @1080, typed 35 ms/char | our type floor and subtitle rule |\n| §5 motion | movement loosely tied to music | keyword → element moves on the word | user iron rule |\n| §6 camera | mostly locked | slow push 1.00→1.07 + drift | our camera-variable rule |\n| §2 rendering | dense haze/grass field, ~3000 dots | demo uses ~2,300 dots + 230 dust | first draft; density to be raised |\n", "DEMO.md": "# DEMO — 光点粒子 test (8 s, 960×540, 24 fps)\nOne example among many. Don't reuse its story, arc, shots, props or timings.\n\nStory: opening of our mosquito film — \"为什么同一间屋、同一个晚上，蚊子只咬你，不咬他？他一觉睡到天亮，你腿上全是包，痒得你半夜爬起来开灯找蚊子。\"\nShots (single continuous shot): dust → dots gather into a house (屋 1.03) → moon gathers in the window (晚上 1.59) → white mosquito swarm flies in (蚊子 1.99) → dives to you, you pulse (你 2.49) → hovers at him, he pulses, it turns back (他 2.97) → Z's float (睡 3.97) → moon sinks (天亮 4.17) → red dots swell on your leg (包 5.19) → your dots shiver (痒 5.37) → your dots re-gather sitting up (爬起来 5.97) → lamp cone of dots (开灯 6.27) → mosquito scatters (找蚊子 6.55) → everything disperses (7.2–8.0).\nPalette: BG #050608, GOLD #f0dba0, SAGE #a7b47f, RED #ff6a4a, COOL #e2ece8. Score: our v9 narration+BGM, −14 LUFS.\nFiles: demo/index.html draws everything (samplers poly/circ/rectFill, keyframes per particle, render(t)); render.mjs frame capture; render_mac.sh mux + loudnorm; build.sh one command.\n"}, "demo_files": ["CREDITS", "audio_8s.wav", "build.sh", "index.html", "render.mjs", "render_mac.sh", "still.mjs"]}, {"slug": "redline-stickman", "en": "Redline Stickman", "cn": "红线火柴人", "based_on": "none (canvas 2D hand-wobble lines)", "borrows": [], "size": "1080x1920", "test_size": "1080x1920", "fps": 30, "library_version": "n/a (own style)", "created": "2026-11-01", "status": "draft", "line": "Warm off-white paper, ink stick figures, one red accent; a chibi presenter talks from the bottom-right while each keyword pops on the beat.", "line_cn": "米白纸上黑色火柴人，全片只用一种红做强调；右下角 Q 版主讲人说话，关键词一出，画面就动。", "source": "Style study of a public X post by @CrazyKaomei (https://x.com/CrazyKaomei/status/2116714340908965924) — style learning only, no original footage kept", "dir": "redline-stickman", "poster": "redline-stickman/test.jpg", "video": "redline-stickman/test.mp4", "styleframe": "redline-stickman/styleframe.jpg", "md": {"STYLE.md": "# 红线火柴人 Redline Stickman（draft）\n1. 画幅：竖屏 1080×1920，30 fps，固定机位一张纸，无硬切。\n2. 色彩：底 #e9e5df；墨 #241e1d；唯一强调红 #c9262f（≤1.5% 面积）；主讲角色蓝 #50adf2（5–8%）。\n3. 版式：顶部账号小字 y≈148；卡拉OK字幕 y≈230–355；压缩粗体标题 y≈446–521 + 手绘红下划线；舞台 y≈600–1200；灰地平线 y≈1229；左下章节号「n /N」；右下主讲角色被底边裁切。\n4. 线条：圆头描边 6–9 px，12 次/秒轻微重抖，逐笔画出。\n5. 造型：火柴人=圆头两点眼弧线嘴；道具=极简图标；主讲=自创 Q 版大头角色。\n6. 动效：回弹弹出 0.25–0.35 s；画线 ease-out 0.4–0.5 s；字幕逐词 0.12 s 淡入上移 10 px。\n7. 节奏：字幕约 1.8 s 一换；关键词出字同帧触发舞台动作。\n8. 转场：换段只换标题+章节号+舞台元素，不运镜。\n9. 声音：旁白为主 + 轻 BGM，−14 LUFS，TP ≤ −1.5 dBTP；关键词可加纸擦小音效。\n10. 字幕：正文无衬线 ~56 px 黑；关键词斜体衬线红 ~62 px。\n11. 禁忌：不用原作角色；不加渐变/阴影/3D；不多于一种强调色。\n", "CHANGES.md": "# CHANGES\n| 章节 | 基础 | 现值 | 原因 |\n|---|---|---|---|\n| 全部 | 新建 | v0.1 draft | 2026-11-01 风格拆解首版 |\n", "DEMO.md": "# DEMO\n8 s 竖屏样片（蚊子题材占位字幕，无配音，BGM 为代码合成占位）。重渲：demo/ 内 `bash render_mac.sh`（需 node、ffmpeg、Chrome、playwright-core）。\n"}, "demo_files": ["audio_8s.wav", "index.html", "render.mjs", "render_mac.sh", "still.mjs"]}], "built": "2026-11-01 23:21:39"}, "official": [{"slug": "caption-news", "num": "63", "en": "Caption News", "cn": "字幕新闻", "cat": "剪辑与纪实", "cat_en": "Edit & Documentary", "film": "The Bee Ledger", "line": "America lost 1.3 million bee colonies, yet the count rose 6 %: a news short that works with the sound off.", "line_cn": "美国一年死掉 130 万箱蜜蜂，总数却涨了 6%：静音也能看懂的新闻。", "uses": ["Social news", "Report explainers", "Data shorts"], "dur": 59.5, "poster": "_official/caption-news.jpg"}, {"slug": "newsreel", "num": "64", "en": "1920s Newsreel", "cn": "1920s 新闻影片", "cat": "剪辑与纪实", "cat_en": "Edit & Documentary", "film": "Knock-Knee Alert", "line": "1926: the papers say the Charleston will ruin America's knees; at Ford's <script>
let S=JSON.parse(document.getElementById('snapshot').textContent||'{}'),LIB=S.library||{styles:[]},OFF=S.official||[],tab='mine',seen=new Set(),live=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(t){t=esc(t);const L=t.split('\n');let o='',tb=null,ul=false;const inl=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/(https?:\/\/[^\s)<]+)/g,'<a href="$1" target="_blank">$1</a>');
for(const l of L){if(/^\|/.test(l)){if(/^\|[\s\-:|]+\|$/.test(l))continue;const c=l.slice(1,-1).split('|').map(x=>inl(x.trim()));if(!tb){tb=1;o+='<table><tr>'+c.map(x=>'<th>'+x+'</th>').join('')+'</tr>'}else o+='<tr>'+c.map(x=>'<td>'+x+'</td>').join('')+'</tr>';continue}if(tb){o+='</table>';tb=null}
if(/^- /.test(l)){if(!ul){o+='<ul>';ul=true}o+='<li>'+inl(l.slice(2))+'</li>';continue}if(ul){o+='</ul>';ul=false}
let m;if(m=l.match(/^(#{1,3}) (.*)/))o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;else if(/^&gt; /.test(l))o+='<p style="color:#a59d92">'+inl(l.slice(5))+'</p>';else if(l.trim())o+='<p>'+inl(l)+'</p>'}
return o+(tb?'</table>':'')+(ul?'</ul>':'')}
function cardMine(s){return `<div class="card${seen.size&&!seen.has(s.slug)?' new':''}" onclick="openS('${esc(s.slug)}')">${s.poster?`<img src="${esc(s.poster)}?h=${LIB.hash}" loading="lazy">`:'<div class="ph">无海报</div>'}
<div class="cb"><div class="cn">${esc(s.cn)}</div><div class="en">${esc(s.en)} · ${esc(s.slug)}</div><div class="ln">${esc(s.line_cn||s.line)}</div>
<div class="meta"><span class="pill ${s.status==='approved'?'ok':''}">${s.status==='approved'?'已认可':esc(s.status||'草稿')}</span><span class="pill">基于：${esc(/^none/.test(s.based_on||'')?'无（canvas 2D 自绘）':s.based_on||'—')}</span><span class="pill">${esc(s.created||'')}</span></div></div></div>`}
function cardOff(s){return `<div class="card" style="cursor:default">${s.poster?`<img src="${esc(s.poster)}" loading="lazy">`:'<div class="ph">无海报</div>'}<div class="cb"><div class="cn">${esc(s.num)} · ${esc(s.cn)}</div><div class="en">${esc(s.en)} · ${esc(s.slug)}</div><div class="ln">${esc(s.line_cn)}</div><div class="meta"><span class="pill">${esc(s.cat)}</span>${(s.uses||[]).slice(0,2).map(u=>`<span class="pill">${esc(u)}</span>`).join('')}</div></div></div>`}
function draw(){const g=$('#grid');if(tab==='mine'){g.innerHTML=LIB.styles.length?LIB.styles.map(cardMine).join(''):'<p>还没有风格。</p>';LIB.styles.forEach(s=>seen.add(s.slug))}else g.innerHTML=OFF.map(cardOff).join('');
$('#status').innerHTML=(tab==='mine'?`我的风格 ${LIB.styles.length} 个`:`官方风格 ${OFF.length} 个（lemo-opuscar，只读）`)+` · 数据 ${esc(LIB.built||'')} · ${live?'<b>站点数据更新时间 '+esc(LIB.built||'')+'</b>（每 5 秒检查一次；公开站有约 10 分钟 CDN 缓存）':'离线快照'}`}
function openS(slug){const s=LIB.styles.find(x=>x.slug===slug);if(!s)return;const say=`用我的风格库 ${s.cn}（${s.slug}）做片`;
$('#pan').innerHTML=`<button class="x" onclick="closeD()">×</button><h2 style="margin:0">${esc(s.cn)} <span class="en">${esc(s.en)}</span></h2><div class="ln">${esc(s.line_cn)}</div>
${s.video?`<video controls preload="metadata" src="${esc(s.video)}?h=${LIB.hash}" poster="${esc(s.poster||'')}"></video>`:''}
<div class="say"><span>做片时对 AI 说：</span><code>${esc(say)}</code><button onclick="navigator.clipboard.writeText('${esc(say)}').then(()=>this.textContent='已复制',()=>this.textContent='请手动复制')">复制</button></div>
<div class="dt">${['STYLE.md','CHANGES.md','DEMO.md'].filter(k=>s.md&&s.md[k]).map((k,i)=>`<button class="tab${i?'':' on'}" onclick="mdt(this,'${k}')">${k.replace('.md','')}</button>`).join('')}<span class="pill" style="margin-left:auto">demo/：${esc((s.demo_files||[]).join('、'))}</span></div>
<div class="md" id="mdv"></div><div class="src">来源：${esc(s.source||'')}</div>`;window._cur=s;mdt($('#pan .dt .tab'),'STYLE.md');$('#dlg').classList.add('on')}
function mdt(b,k){document.querySelectorAll('#pan .dt .tab').forEach(x=>x.classList.toggle('on',x===b));$('#mdv').innerHTML=md(window._cur.md[k]||'')}
function closeD(){$('#dlg').classList.remove('on');document.querySelectorAll('#pan video').forEach(v=>v.pause())}
$('#dlg').onclick=e=>{if(e.target.id==='dlg')closeD()};
document.querySelectorAll('header .tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('header .tab').forEach(x=>x.classList.toggle('on',x===b));draw()});
async function poll(){try{const r=await fetch('library.json?_='+Date.now(),{cache:'no-store'});const j=await r.json();live=true;
if(j.hash!==LIB.hash){LIB=j;if(!OFF.length){try{OFF=await (await fetch('official.json',{cache:'no-store'})).json()}catch(e){}}if(!$('#dlg').classList.contains('on'))draw();else LIB=j}else if(!$('#status b'))draw()}catch(e){live=false}}
draw();if(location.protocol!=='file:'){poll();setInterval(poll,5000)}
</script></body></html>
